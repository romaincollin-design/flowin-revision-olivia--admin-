<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowin Révision — Espace professeur (desktop)</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pp:#534AB7;--pp2:#7F77DD;--ppbg:#EEEDFE;--ppln:#AFA9EC;--ink:#14162A;--ink2:#3D4268;--ink3:#8B90B8;--surf:#fff;--bg:#F3F3F9;--line:rgba(0,0,0,.08);--gr:#0E9E6E;--grbg:#E4F7F0;--am:#C27C0A;--ambg:#FBEEDA;--re:#D63050;--bl:#1E6FCC;--gold:#E0A800;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
svg.i{width:1em;height:1em;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em}
.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
.side{background:var(--surf);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:8px;padding:0 4px 16px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#5B52C9,#7F77DD);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;font-size:15px}
.brand .name{font-weight:800;font-size:13.5px}
.etabsel{display:flex;align-items:center;justify-content:space-between;background:var(--ppbg);border:1px solid var(--ppln);border-radius:9px;padding:7px 10px;margin:0 4px 12px;cursor:pointer;font-size:12px}
.etabsel .n{font-weight:700;font-size:12.5px;color:var(--pp)}
.etabmenu{position:absolute;left:16px;top:120px;width:216px;background:var(--surf);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px -10px rgba(0,0,0,.2);z-index:40;padding:8px}
.etabmenu .it{padding:9px 10px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;justify-content:space-between}
.etabmenu .it:hover{background:var(--bg)}
.etabmenu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;color:var(--ink2);text-decoration:none;font-weight:600;font-size:12.5px;margin-bottom:1px;cursor:pointer}
.nav a.on{background:var(--ppbg);color:var(--pp)}
.nav a:hover{background:var(--bg)}
.nav .sec{font-size:10px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px 12px}
.side .foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.main{padding:26px 34px 60px;max-width:1320px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:16px}
.h1{font-size:23px;font-weight:800;letter-spacing:-.4px}
.sub{color:var(--ink3);font-size:13px;margin-top:2px}
.btn{background:var(--pp);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn.sec{background:var(--surf);color:var(--pp);border:1.5px solid var(--ppln)}
.back{width:34px;height:34px;border-radius:50%;background:var(--surf);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);flex-shrink:0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi .lab{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:26px;font-weight:800;color:var(--pp);margin-top:6px}
.kpi .d{font-size:12px;margin-top:4px;font-weight:600}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start;margin-bottom:22px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:20px}
.card h3{font-size:15px;font-weight:800;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.chart .bar{flex:1;text-align:center}
.chart .bar i{display:block;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--pp2),var(--pp))}
.chart .bar span{display:block;margin-top:6px;font-size:11px;color:var(--ink3);font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(0,0,0,.05)}
.row:last-child{border:0}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--ppbg);color:var(--pp);font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;color:var(--ink3);text-transform:uppercase;font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;font-size:13.5px;border-bottom:1px solid rgba(0,0,0,.05)}
tr.link{cursor:pointer}
tr.link:hover td{background:var(--bg)}
.bar-mini{width:80px;height:8px;background:var(--bg);border-radius:6px;overflow:hidden;display:inline-block;vertical-align:middle}
.bar-mini i{display:block;height:100%;background:var(--pp)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);border-radius:20px;padding:6px 12px;font-weight:600;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--ppbg);color:var(--pp);border-color:var(--ppln)}
.editor{display:grid;grid-template-columns:1fr 1.15fr;gap:18px}
.qcard{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.qcard.sel{border-color:var(--ppln);background:var(--ppbg)}
.tile-ans{border-radius:8px;padding:9px;font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;color:#fff}
.dz{border:1.5px dashed var(--ppln);border-radius:12px;padding:22px;text-align:center;color:var(--pp);font-weight:600;font-size:13px;cursor:pointer;background:var(--ppbg)}
.anon{display:flex;gap:10px;background:var(--ppbg);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--pp);font-weight:600;align-items:flex-start}
.clist{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surf)}
.clist .grp{padding:10px 16px;background:var(--bg);font-size:11px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.clist .it{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line);cursor:pointer}
.clist .it:hover{background:var(--bg)}
.clist .ic{width:38px;height:38px;border-radius:10px;background:var(--ppbg);color:var(--pp);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.kbd{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--surf);border:1px solid var(--line);border-radius:11px;margin-bottom:8px;cursor:pointer}
.kbd .it{display:flex;align-items:center;gap:11px;padding:11px 13px;margin:0 0 8px 12px;border:1px solid var(--line);border-radius:11px;cursor:pointer}
.kbd .it:hover{background:var(--bg)}
.reglagesgrp{padding:9px 0;border-top:1px solid var(--line)}
.reglagesgrp:first-child{border-top:0;padding-top:0}
.reglagesgrp .lab2{font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:.03em;margin-bottom:7px}
.chipsm{padding:5px 11px!important;font-size:12px!important}
.eqmini{margin-bottom:10px}
.eqmini .hd{display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-bottom:4px}
.eqmini .hd b{color:var(--pp)}
.tl{display:flex;gap:10px;align-items:flex-start;padding:9px 0}
.tl .dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex-shrink:0}
.kbd .it:hover{background:var(--bg)}
.field label{font-size:12px;font-weight:600;color:var(--ink2);display:block;margin-bottom:6px}
.field input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px;font-family:inherit;font-size:14px}
.kb{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;background:var(--surf);border:1px solid var(--line);border-radius:11px;margin-bottom:8px;cursor:pointer}
.kbitem{display:flex;align-items:center;gap:11px;padding:11px 13px;margin:0 0 8px 10px;border:1px solid var(--line);border-radius:11px;cursor:pointer}
.kbitem:hover{background:var(--bg)}
.slider{width:100%;accent-color:var(--pp)}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:22px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:99;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark"><svg class="i" viewBox="0 0 24 24"><path d="M3 21h18M5 21V8l7-4 7 4v13M9 21v-4h6v4M9 12h.01M15 12h.01"/></svg></div><div class="name">Flowin Révision</div></div>
    <div id="etabzone"></div>
    <nav class="nav" id="nav">
      <a data-p="pilotage"><svg class="i" viewBox="0 0 24 24"><path d="M3 3v18h18M7 15l4-6 3 3 4-7"/></svg>Pilotage</a>
      <a data-p="classes"><svg class="i" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Classes</a>
      <a data-p="quizhub"><svg class="i" viewBox="0 0 24 24"><path d="M12 2 15 9l7 .5-5.5 4.5L18 21l-6-3.8L6 21l1.5-7L2 9.5 9 9z"/></svg>Quiz &amp; challenges</a>
      <a data-p="cours"><svg class="i" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"/></svg>Mes cours</a>
      <a data-p="cagnotte"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.5A2.5 2.5 0 0 0 12 8.5h-1.5a2 2 0 0 0 0 4H13a2 2 0 0 1 0 4h-1.5A2.5 2.5 0 0 1 9 15"/></svg>Cagnotte</a>
      <div class="sec">Compte</div>
      <a data-p="profil"><svg class="i" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>Profil &amp; paramètres</a>
    </nav>
    <div class="foot"><div class="av">O</div><div><div style="font-weight:700;font-size:12.5px">Olivia Laurent</div><div style="color:var(--ink3);font-size:11px">Lycée de Vence</div></div></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="toast"></div>

<script>
var ICON={
 wand:'<svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.4 4.1L17.5 8l-4.1 1.4L12 13.5l-1.4-4.1L6.5 8l4.1-.9zM19 14l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>',
 list:'<svg class="i" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
 plus:'<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
 lock:'<svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
 check:'<svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
 doc:'<svg class="i" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
 chev:'<svg class="i" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>',
 back:'<svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
 qr:'<svg class="i" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z"/></svg>',
 school:'<svg class="i" viewBox="0 0 24 24"><path d="M3 21h18M5 21V8l7-4 7 4v13M9 21v-4h6v4M9 12h.01M15 12h.01"/></svg>'
};
function qrSvg(){var r='';for(var y=0;y<11;y++)for(var x=0;x<11;x++){if((x*y+x+y)%3===0||(x<3&&y<3)||(x>7&&y<3)||(x<3&&y>7))r+='<rect x="'+(x*10)+'" y="'+(y*10)+'" width="10" height="10" fill="#111"/>';}return '<svg viewBox="0 0 110 110" style="width:120px;height:120px">'+r+'</svg>';}

/* ---- ÉTAT (partagé, cohérent avec le mobile) ---- */
var CLASSES=[['Terminale Bac Pro',19,1240,'Terminale',320],['1re Bac Pro Commerce',22,860,'1re',180],['2de Bac Pro ASSP',18,540,'2de',90]];
var COURS=[['Le jeu des puissances','Histoire',1,'23 fiches liées'],['La guerre froide','Histoire',1,'12 fiches liées'],['La mondialisation','Géo',0,'8 fiches liées'],['Prévention des risques','PSE',1,'6 fiches liées']];
var ELEVES=[['Soso',512,'82%','Or','#D63050,82;#1E6FCC,64;#C27C0A,74;#0E9E6E,58'],['Lilou',395,'71%','Argent','#D63050,70;#1E6FCC,60;#C27C0A,65;#0E9E6E,55'],['MarcX',300,'64%','Argent','#D63050,60;#1E6FCC,55;#C27C0A,50;#0E9E6E,48'],['Nadir06',280,'58%','Bronze','#D63050,55;#1E6FCC,50;#C27C0A,48;#0E9E6E,45'],['Emma_V',255,'55%','Bronze','#D63050,52;#1E6FCC,48;#0E9E6E,45;#C27C0A,44']];
var CHALLENGES=[{t:"La guerre froide",cl:"Terminale Bac Pro",d:"5 mars",s:"passe",r:"72% de réussite · écart 18"},{t:"Le jeu des puissances",cl:"Terminale Bac Pro",d:"12 mars",s:"encours",r:""},{t:"Mondialisation",cl:"Terminale Bac Pro",d:"20 mars",s:"asuivre",r:""}];
var QUESTIONS=[{q:"En quelle année tombe le mur de Berlin ?",a:["1961","1989","1991","1975"],c:1,diff:"Facile",valid:true},{q:"Qui dirige l'URSS pendant la crise de Cuba ?",a:["Khrouchtchev","Staline","Brejnev","Lénine"],c:0,diff:"Moyen",valid:false}];
var BANK=[{q:"Que symbolise le rideau de fer ?",a:["Partition de l'Europe","L'ONU","La décolonisation","L'OTAN"],c:0},{q:"Qui lance le plan Marshall ?",a:["Les États-Unis","L'URSS","La France","L'ONU"],c:0},{q:"Quelle alliance regroupe le bloc de l'Est ?",a:["OTAN","Pacte de Varsovie","ONU","CEE"],c:1}];
var DRAFTS=[{t:"La décolonisation",theme:"Histoire",d:"18 mars"}];
var KBOPEN={asuivre:false,encours:true,passe:false};
var CURPSEUDO=null, CURSTEP='list';
var CUREQR=0;
function openEleveQR(i){CUREQR=i;go('eleveqr');}
var ETABS=['Lycée de Vence','Lycée Estienne d\'Orves'];
var CURETAB=0, ETABMENU=false;
function toggleEtabMenu(){ETABMENU=!ETABMENU;render();}
function setEtab(i){CURETAB=i;ETABMENU=false;toast('Établissement : '+ETABS[i]);render();}
function newEtab(){var n=prompt('Nom du nouvel établissement à créer ou rejoindre :');if(n){ETABS.push(n);CURETAB=ETABS.length-1;}ETABMENU=false;render();}
var CURCLASSE=0;
function openClasse(i){CURCLASSE=i;go('classedetail');}
var CURCOURS=null;
function openCours(t){CURCOURS=t;go('coursdetail');}
var CLASSPERIOD='trimestre';
function setPeriod(p){CLASSPERIOD=p;render();}
var LOTQR=[{ps:'Soso',pts:50,statut:'attente'},{ps:'MarcX',pts:30,statut:'attente'},{ps:'Lilou',pts:30,statut:'attente'},{ps:'Nadir06',pts:20,statut:'attente'}];
function simulateScan(i){LOTQR[i].statut='encaissé';toast(LOTQR[i].ps+' a flashé — '+LOTQR[i].pts+' pts crédités, déstocké');render();}

function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.className='show';clearTimeout(window._tt);window._tt=setTimeout(function(){t.className='';},1800);}
function chipPick(el){var pr=el.parentNode;pr.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on');});el.classList.add('on');}
function qValid(i){QUESTIONS[i].valid=true;toast('Question validée');render();}
function qDiff(i){var d=QUESTIONS[i].diff;var nx={Facile:'Moyen',Moyen:'Difficile',Difficile:'Facile'}[d];QUESTIONS[i].diff=nx;render();}
function qAddManuel(){QUESTIONS.push({q:'Nouvelle question — clique pour éditer',a:['Réponse 1','Réponse 2','Réponse 3','Réponse 4'],c:0,diff:'Moyen',valid:false});toast('Question ajoutée (manuel)');render();}
function qAddBank(i){var b=BANK[i];QUESTIONS.push({q:b.q,a:b.a.slice(),c:b.c,diff:'Moyen',valid:false});toast('Question ajoutée depuis la banque');render();}
function qAddIA(){var gen=[{q:"Quel événement marque le début de la guerre froide ?",a:["Doctrine Truman","Chute du mur","Crise de Cuba","Plan Marshall"],c:0},{q:"Que désigne la coexistence pacifique ?",a:["Une détente relative","Une guerre ouverte","La fin de l'URSS","Un traité de paix"],c:0},{q:"En quelle année a lieu la crise de Cuba ?",a:["1949","1962","1975","1989"],c:1}];
  gen.forEach(function(g){QUESTIONS.push({q:g.q,a:g.a,c:g.c,diff:'Difficile',valid:false});});toast("5 questions générées par l'IA — à relire");render();}
function qDel(i){QUESTIONS.splice(i,1);render();}
function publishQuiz(){CHALLENGES.unshift({t:'Le jeu des puissances',cl:'Terminale Bac Pro',d:"aujourd'hui",s:'encours',r:''});LOTQR.forEach(function(l){l.statut='attente';});toast('Quiz publié et lancé');go('quizresult');}
function saveDraft(){DRAFTS.unshift({t:'Le jeu des puissances',theme:'Histoire',d:"aujourd'hui"});toast('Brouillon enregistré');go('quizhub');}
function kbToggle(g){KBOPEN[g]=!KBOPEN[g];render();}
function openPseudo(ps){CURPSEUDO=ps;go('fiche');}

var PAGE='pilotage';
function go(p){PAGE=p;render();document.querySelectorAll('#nav a').forEach(function(a){a.classList.toggle('on',a.dataset.p===p);});window.scrollTo(0,0);}
document.getElementById('nav').addEventListener('click',function(e){var a=e.target.closest('a');if(a)go(a.dataset.p);});

var PAGES={
 pilotage:function(){return ''
  +'<div class="topbar"><div><div class="h1">Pilotage</div><div class="sub">Lycée de Vence · Histoire, Géo, EMC, PSE</div></div><button class="btn" onclick="go(\'quizbuild\')">'+ICON.plus+' Nouveau quiz</button></div>'
  +'<div class="kpis">'
    +'<div class="kpi"><div class="lab">Élèves actifs</div><div class="v">59</div><div class="d" style="color:var(--gr)">+4 cette semaine</div></div>'
    +'<div class="kpi"><div class="lab">Points distribués</div><div class="v">2 640</div><div class="d" style="color:var(--ink3)">sur 4 500 pts de quota</div></div>'
    +'<div class="kpi"><div class="lab">Réussite moyenne</div><div class="v">68%</div><div class="d" style="color:var(--gr)">+5 pts vs mois dernier</div></div>'
    +'<div class="kpi"><div class="lab">Écart best/worst</div><div class="v">18%</div><div class="d" style="color:var(--am)">bonus homogénéité actif</div></div>'
  +'</div>'
  +'<div class="grid2">'
    +'<div class="card"><h3>Progression de la classe (Terminale Bac Pro)<span class="pill">Histoire</span></h3><div class="chart">'+['S,30','O,42','N,38','D,55','J,60','F,72','M,82'].map(function(m){var x=m.split(',');return '<div class="bar"><i style="height:'+(x[1]*1.5)+'px"></i><span>'+x[0]+'</span></div>';}).join('')+'</div></div>'
    +'<div class="card"><h3>Challenges interclasse<span class="pill">en cours</span></h3>'+CLASSES.map(function(c){var w=Math.round(c[2]/1300*100);return '<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:5px"><span>'+c[0]+'</span><span style="color:var(--pp)">'+c[2]+' pts</span></div><div class="bar-mini" style="width:100%"><i style="width:'+w+'%"></i></div></div>';}).join('')+'</div>'

 },
 quizresult:function(){var res=[['Soso',5,512,'A'],['MarcX',3,300,'B'],['Lilou',3,395,'C'],['Nadir06',2,280,'D']].sort(function(a,b){return b[1]-a[1];});
  var moy=Math.round(res.reduce(function(a,r){return a+r[1];},0)/res.length/5*100);
  var ecart=Math.round((res[0][1]-res[res.length-1][1])/5*100);
  return ''
  +'<div class="topbar"><div><div class="h1">R\xe9sultats</div><div class="sub">Le jeu des puissances \xb7 Terminale Bac Pro \xb7 envoy\xe9 \xe0 l\'instant</div></div></div>'
  +'<div class="kpis" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><div class="lab">R\xe9pondants</div><div class="v">'+res.length+' / 19</div></div><div class="kpi"><div class="lab">R\xe9ussite moyenne</div><div class="v">'+moy+'%</div></div><div class="kpi"><div class="lab">\xc9cart best/worst</div><div class="v">'+ecart+'%</div></div></div>'
  +'<div class="anon" style="margin-bottom:16px">'+ICON.lock+'<div>R\xe9sultats par pseudo uniquement.</div></div>'
  +'<div class="card"><h3>Classement de la manche</h3><table><tr><th>Rang</th><th>Pseudo</th><th>Bonnes r\xe9ponses</th><th>Points totaux</th></tr>'
    +res.map(function(r,idx){return '<tr><td style="font-weight:800;color:var(--pp)">'+(idx+1)+'</td><td style="font-weight:700">'+r[0]+'</td><td>'+r[1]+' / 5</td><td style="font-weight:700">'+r[2]+'</td></tr>';}).join('')
  +'</table></div>'
  +'<button class="btn" style="margin-top:6px" onclick="go(\'chalqr\')">'+ICON.qr+' Distribuer les points (QR)</button>';
 },
  chalqr:function(){return ''
  +'<div class="topbar"><div style="display:flex;align-items:center;gap:14px"><button class="back" onclick="go(\'quizhub\')">'+ICON.back+'</button><div><div class="h1">Distribution des points</div><div class="sub">Le jeu des puissances · Terminale Bac Pro</div></div></div></div>'
  +'<div class="anon" style="margin-bottom:18px">'+ICON.lock+'<div>Un QR par pseudo gagnant. Seul ce pseudo peut le flasher et créditer ses points — aucun vol possible.</div></div>'
  +'<div class="grid2" style="grid-template-columns:1fr 1fr">'+LOTQR.map(function(l,i){var done=l.statut==='encaissé';return '<div class="card" style="'+(done?'opacity:.55':'')+'"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div style="font-weight:700;font-size:14.5px">'+l.ps+'</div><span class="pill" style="'+(done?'background:var(--grbg);color:var(--gr)':'')+'">'+(done?'Encaissé':'En attente')+'</span></div>'
    +'<div style="display:flex;gap:16px;align-items:center"><div style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px">'+qrSvg()+'</div><div><div class="lab">Points</div><div class="v" style="font-size:22px">+'+l.pts+'</div>'+(done?'':'<div style="display:flex;flex-direction:column;gap:6px;margin-top:10px"><button class="btn sec" onclick="simulateScan('+i+')">Simuler le flash</button><button class="chip" style="justify-content:center" onclick="openEleveQR('+i+')">Voir son écran</button></div>')+'</div></div></div>';}).join('')+'</div>'
  +'<button class="btn" style="margin-top:18px" onclick="go(\'eleveqr\')">'+ICON.qr+' Aperçu — ce que voit l\'élève</button>';
 },
 eleveqr:function(){var l=LOTQR[CUREQR]||LOTQR[0];return ''
  +'<div class="topbar"><div style="display:flex;align-items:center;gap:14px"><button class="back" onclick="go(\'chalqr\')">'+ICON.back+'</button><div class="h1">Aper\u00e7u \u00b7 vue \u00e9l\u00e8ve</div></div></div>'
  +'<div class="card" style="max-width:380px;text-align:center;padding:30px 24px"><div style="width:60px;height:60px;border-radius:50%;background:var(--grbg);color:var(--gr);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:26px">'+ICON.check+'</div>'
    +'<div style="font-weight:800;font-size:18px">QR flash\u00e9 !</div>'
    +'<div style="font-size:38px;font-weight:800;color:var(--pp);margin:10px 0 4px">+'+l.pts+'</div>'
    +'<div class="sub" style="margin-bottom:16px">points cr\u00e9dit\u00e9s sur ton pseudo '+l.ps+'</div>'
    +'<div class="anon" style="text-align:left">'+ICON.lock+'<div>Cr\u00e9dit\u00e9s directement sur ta plateforme. Ton prof ne voit jamais cette \u00e9tape ni ton identit\u00e9.</div></div>'
  +'</div>';
 },
  profil:function(){return ''
  +'<div class="topbar"><div class="h1">Profil &amp; paramètres</div></div>'
  +'<div class="anon" style="margin-bottom:18px">'+ICON.lock+'<div>Anonymat total : tu ne vois que les pseudos de tes élèves, sur mobile comme sur ordinateur.</div></div>'
  +'<div class="grid2" style="grid-template-columns:1fr 1fr">'
   +'<div class="card"><h3>Mes informations</h3><div style="font-size:13.5px;color:var(--ink2);line-height:2.1">Olivia Laurent<br>o.laurent@ac-nice.fr<br>06 12 34 56 78</div></div>'
   +'<div class="card"><h3>Mes établissements</h3><div class="row"><div style="flex:1;font-weight:700;font-size:13.5px">Lycée de Vence</div><span class="pill">principal</span></div><div class="row"><div style="flex:1;font-weight:700;font-size:13.5px">Lycée Estienne d\'Orves</div></div></div>'
  +'</div>';
 }
};
function renderEtab(){var z=document.getElementById('etabzone');if(!z)return;var html='<div class="etabsel" onclick="toggleEtabMenu()"><span class="n">'+ETABS[CURETAB]+'</span><span style="color:var(--pp)">'+ICON.chev+'</span></div>';
  if(ETABMENU){html+='<div class="etabmenu">'+ETABS.map(function(e,i){return '<div class="it" onclick="setEtab('+i+')">'+e+(i===CURETAB?' <span style="color:var(--pp)">'+ICON.check+'</span>':'')+'</div>';}).join('')+'<hr><div class="it" style="color:var(--pp)" onclick="newEtab()">'+ICON.plus+' Créer ou rejoindre…</div></div>';}
  z.innerHTML=html;}
function render(){document.getElementById('main').innerHTML=(PAGES[PAGE]||PAGES.pilotage)();renderEtab();}
go('pilotage');
