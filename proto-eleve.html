<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowin Révision — App élève (prototype navigable)</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pp:#534AB7;--pp2:#7F77DD;--ppbg:#EEEDFE;--ppln:#AFA9EC;--ink:#14162A;--ink2:#3D4268;--ink3:#8B90B8;--surf:#fff;--bg:#F3F3F9;--line:rgba(0,0,0,.08);--gr:#0E9E6E;--grbg:#E4F7F0;--am:#C27C0A;--re:#D63050;--bl:#1E6FCC;--gold:#E0A800;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,sans-serif;background:#E9E9F2;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
svg.i{width:1em;height:1em;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em}
.device{width:390px;height:800px;max-height:94vh;background:#0B0D1A;border-radius:44px;padding:12px;box-shadow:0 40px 80px -24px rgba(83,74,183,.5)}
.viewport{width:100%;height:100%;background:var(--bg);border-radius:33px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.status{display:flex;justify-content:space-between;padding:13px 24px 4px;font-size:13px;font-weight:700;flex-shrink:0}
.status .dd{display:flex;gap:3px;align-items:center}.status .dd i{width:4px;height:4px;border-radius:50%;background:var(--ink3);display:block}
.screen{flex:1;overflow-y:auto;padding:6px 20px 90px}
.screen::-webkit-scrollbar{width:0}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:74px;background:var(--surf);border-top:1px solid var(--line);display:flex;padding:8px 12px 20px;z-index:20}
.tabbar button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);font-size:10px;font-weight:600;cursor:pointer}
.tabbar button.on{color:var(--pp)}
.tabbar button svg{font-size:22px}
.top{display:flex;align-items:center;gap:12px;padding:10px 0 14px}
.back{width:36px;height:36px;border-radius:50%;background:var(--surf);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);flex-shrink:0}
.h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
.h2{font-size:18px;font-weight:700;margin:14px 0 10px}
.sub{color:var(--ink3);font-size:13px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.stat3{display:flex;gap:9px;margin-bottom:14px}.stat3 .s{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat3 .v{font-size:22px;font-weight:800;color:var(--pp)}.stat3 .l{font-size:10px;color:var(--ink3);font-weight:700;text-transform:uppercase;margin-top:2px}
.brick{display:flex;align-items:center;gap:14px;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:11px;cursor:pointer;transition:.15s;width:100%;text-align:left}
.brick:active{transform:scale(.98)}
.brick .ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;flex-shrink:0}
.brick .t{font-weight:700;font-size:16px}.brick .d{color:var(--ink3);font-size:12px}
.brick .go{margin-left:auto;color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:20px;padding:7px 13px;font-weight:600;font-size:13px;cursor:pointer;user-select:none}
.chip.on{background:var(--ppbg);color:var(--pp);border-color:var(--ppln)}
.chip .sw{width:11px;height:11px;border-radius:3px}
.chip.off{opacity:.35}
.btn{background:var(--pp);color:#fff;border:none;border-radius:13px;padding:15px;text-align:center;font-weight:700;font-size:15px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:var(--surf);color:var(--pp);border:1.5px solid var(--ppln)}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--ppbg);color:var(--pp);font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px}
.lab{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.mut{color:var(--ink3);font-size:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{border-radius:13px;padding:16px 14px;color:#fff;font-weight:700;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px;border:none}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(0,0,0,.05)}
.av{width:36px;height:36px;border-radius:50%;background:var(--pp);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.rank{width:20px;font-weight:800;color:var(--pp);text-align:center}
.gold{background:linear-gradient(135deg,#F4C430,var(--gold));color:#3a2c00}
.tier{display:flex;gap:5px;margin-bottom:14px}.tier .t{flex:1;text-align:center;font-size:9px;font-weight:800;padding:7px 2px;border-radius:8px;color:#fff;text-transform:uppercase}
.wheelwrap{position:relative;width:230px;height:230px;margin:8px auto 0}
.needle{position:absolute;top:-3px;left:50%;transform:translateX(-50%);border:11px solid transparent;border-top-color:var(--ink);z-index:3}
.wheel{width:230px;height:230px;border-radius:50%;box-shadow:inset 0 0 0 7px #fff,0 12px 26px -8px rgba(0,0,0,.35);transition:transform 3.4s cubic-bezier(.17,.67,.2,1)}
.hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--pp);font-size:11px;z-index:2}
.fiche b{color:var(--ink)}
.dline{display:flex;gap:10px;font-size:13px;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.05)}.dline .y{font-weight:800;color:var(--pp);flex:0 0 56px}
.done{width:72px;height:72px;border-radius:50%;background:var(--grbg);color:var(--gr);display:flex;align-items:center;justify-content:center;margin:20px auto 12px;font-size:34px}
</style>
</head>
<body>

function render(){
  scr.innerHTML = (SCREENS[current]||SCREENS.hub)();
  // tabbar
  tb.innerHTML='';
  var map={reviser:'reviser',fiche:'reviser',quizdiff:'quiz',quiz:'quiz',quizplay:'quiz',quizresult:'quiz',defis:'defis',deficreate:'defis',defiroom:'defis',qrlive:'defis',defirules:'defis',defiinvit:'defis',defiwait:'defis',ligue:'ligue',profil:'profil',mesinfos:'profil',hub:'hub'};
  TABS.forEach(function(t){var b=document.createElement('button');b.className=(map[current]===t[0])?'on':'';b.innerHTML=ICON[t[2]]+'<span>'+t[1]+'</span>';b.onclick=function(){nav(t[0]);};tb.appendChild(b);});
  if(current==='quiz') mountWheel();
}
function mountWheel(){
  var chips=document.getElementById('mchips');
  MAT.forEach(function(m){var el=document.createElement('div');el.className='chip'+(wheelState.enabled[m.k]?' on':' off');el.innerHTML='<span class="sw" style="background:'+m.c+'"></span>'+m.n;el.onclick=function(){if(wheelState.spinning)return;var act=MAT.filter(function(x){return wheelState.enabled[x.k];});if(wheelState.enabled[m.k]&&act.length<=1)return;wheelState.enabled[m.k]=!wheelState.enabled[m.k];mountWheel();drawWheel();document.getElementById('spinRes').textContent='';};chips.appendChild(el);});
  drawWheel();
}
function drawWheel(){var w=document.getElementById('wheel');if(!w)return;var act=MAT.filter(function(m){return wheelState.enabled[m.k];});if(!act.length){w.style.background='#EEEDFE';return;}var seg=100/act.length,acc=0,stops=[];act.forEach(function(m){stops.push(m.c+' '+acc+'% '+(acc+seg)+'%');acc+=seg;});w.style.background='conic-gradient('+stops.join(',')+')';w.style.transform='rotate('+wheelState.rot+'deg)';}
function spin(){var act=MAT.filter(function(m){return wheelState.enabled[m.k];});if(wheelState.spinning||!act.length)return;wheelState.spinning=true;var btn=document.getElementById('spinBtn');btn.disabled=true;var pick=Math.floor(Math.random()*act.length);var seg=360/act.length;wheelState.rot+=360*5+(360-(pick*seg+seg/2));drawWheel();setTimeout(function(){wheelState.spinning=false;var r=document.getElementById('spinRes');if(r)r.innerHTML='Thème tiré dans <b style="color:'+act[pick].c+'">'+act[pick].n+'</b> !';setTimeout(function(){nav('quizdiff');},700);},3500);}
render();
