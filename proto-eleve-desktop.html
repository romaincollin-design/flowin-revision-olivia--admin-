<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowin Révision — Espace élève (desktop)</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pp:#534AB7;--pp2:#7F77DD;--ppbg:#EEEDFE;--ppln:#AFA9EC;--ink:#14162A;--ink2:#3D4268;--ink3:#8B90B8;--surf:#fff;--bg:#F3F3F9;--line:rgba(0,0,0,.08);--gr:#0E9E6E;--grbg:#E4F7F0;--am:#C27C0A;--ambg:#FBEEDA;--re:#D63050;--bl:#1E6FCC;--gold:#E0A800;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
svg.i{width:1em;height:1em;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em}
.app{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
.side{background:var(--surf);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:8px;padding:0 4px 16px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#5B52C9,#7F77DD);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;font-size:15px}
.brand .name{font-weight:800;font-size:13.5px}
.nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;color:var(--ink2);text-decoration:none;font-weight:600;font-size:12.5px;margin-bottom:1px;cursor:pointer}
.nav a.on{background:var(--ppbg);color:var(--pp)}
.nav a:hover{background:var(--bg)}
.side .foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:9px}
.av{width:32px;height:32px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.main{padding:26px 34px 60px;max-width:1280px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:16px}
.h1{font-size:23px;font-weight:800;letter-spacing:-.4px}
.sub{color:var(--ink3);font-size:13px;margin-top:2px}
.btn{background:var(--pp);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn.sec{background:var(--surf);color:var(--pp);border:1.5px solid var(--ppln)}
.back{width:34px;height:34px;border-radius:50%;background:var(--surf);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);flex-shrink:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:12px}
.kpi .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0}
.kpi .v{font-size:22px;font-weight:800}
.kpi .l{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start;margin-bottom:22px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:20px}
.card h3{font-size:15px;font-weight:800;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.tile{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;margin-bottom:11px}
.tile:hover{background:var(--bg)}
.tile .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--ppbg);color:var(--pp);font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(0,0,0,.05)}
.row:last-child{border:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:20px;padding:7px 13px;font-weight:600;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--ppbg);color:var(--pp);border-color:var(--ppln)}
.chip .sw{width:11px;height:11px;border-radius:3px}
.wheelwrap{position:relative;width:210px;height:210px;margin:0 auto}
.needle{position:absolute;top:-3px;left:50%;transform:translateX(-50%);border:10px solid transparent;border-top-color:var(--ink);z-index:3}
.wheel{width:210px;height:210px;border-radius:50%;box-shadow:inset 0 0 0 6px #fff,0 12px 26px -8px rgba(0,0,0,.35);transition:transform 3.4s cubic-bezier(.17,.67,.2,1)}
.hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--pp);font-size:11px;z-index:2}
.dline{display:flex;gap:10px;font-size:13px;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.05)}
.dline .y{font-weight:800;color:var(--pp);flex:0 0 50px}
.tier{display:flex;gap:5px;margin-bottom:14px}.tier .t{flex:1;text-align:center;font-size:9px;font-weight:800;padding:7px 2px;border-radius:8px;color:#fff;text-transform:uppercase}
.rank{width:22px;font-weight:800;color:var(--pp);text-align:center}

@keyframes coinFall{0%{transform:translateY(-40px) rotate(0deg);opacity:0}10%{opacity:1}70%{transform:translateY(70vh) rotate(360deg)}100%{transform:translateY(90vh) rotate(420deg);opacity:0}}
@keyframes coinWobble{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}
@keyframes burstPop{0%{transform:scale(.3);opacity:0}55%{transform:scale(1.12);opacity:1}75%{transform:scale(.97)}100%{transform:scale(1);opacity:1}}
@keyframes burstOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
@keyframes ringPulse{0%{box-shadow:0 0 0 0 rgba(83,74,183,.45)}100%{box-shadow:0 0 0 26px rgba(83,74,183,0)}}
.gcoin{position:fixed;top:-40px;font-size:22px;z-index:9998;animation:coinFall 1.6s cubic-bezier(.4,0,.6,1) forwards,coinWobble 0.5s ease-in-out infinite alternate}
.gburst{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;pointer-events:none}
.gcard{background:#fff;border-radius:22px;padding:30px 46px;text-align:center;box-shadow:0 30px 70px -20px rgba(83,74,183,.5);animation:burstPop .55s cubic-bezier(.2,1.4,.4,1) forwards;pointer-events:auto}
.gmedal{width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,#FBBF24,#E0A800);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:#fff;font-size:32px;animation:ringPulse 1.3s ease-out infinite}
.gpts{font-size:44px;font-weight:800;color:var(--pp);margin:4px 0}
.gout{animation:burstOut .35s ease forwards}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mark"><svg class="i" viewBox="0 0 24 24"><path d="M12 2 15 9l7 .5-5.5 4.5L18 21l-6-3.8L6 21l1.5-7L2 9.5 9 9z"/></svg></div><div class="name">Flowin Révision</div></div>
    <nav class="nav" id="nav">
      <a data-p="hub"><svg class="i" viewBox="0 0 24 24"><path d="M3 10l9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Accueil</a>
      <a data-p="reviser"><svg class="i" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"/></svg>Réviser</a>
      <a data-p="quiz"><svg class="i" viewBox="0 0 24 24"><path d="M12 2 15 9l7 .5-5.5 4.5L18 21l-6-3.8L6 21l1.5-7L2 9.5 9 9z"/></svg>Quiz</a>
      <a data-p="defis"><svg class="i" viewBox="0 0 24 24"><path d="M21 3v5l-11 9-4 4-3-3 4-4 9-11z"/><path d="M5 13l6 6"/><path d="M14.3 17.3l3.7 3.7 3-3-3.7-3.7"/><path d="M10 5.5 8 3H3v5l3 2.5"/></svg>Défis</a>
      <a data-p="classe"><svg class="i" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Ma classe</a>
      <a data-p="ligue"><svg class="i" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 4H4v2a3 3 0 0 0 3 3M17 4h3v2a3 3 0 0 1-3 3"/></svg>Ligue</a>
      <a data-p="profil"><svg class="i" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>Profil</a>
    </nav>
    <div class="foot"><div class="av">S</div><div><div style="font-weight:700;font-size:12px">Soso</div><div style="color:var(--ink3);font-size:10.5px">Lycée de Vence</div></div></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="toast" style="position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:22px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:99;pointer-events:none"></div>
<div id="gainlayer"></div>

<script>
var ICON={
 star:'<svg class="i" viewBox="0 0 24 24"><path d="M12 2 15 9l7 .5-5.5 4.5L18 21l-6-3.8L6 21l1.5-7L2 9.5 9 9z"/></svg>',
 book:'<svg class="i" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"/></svg>',
 defi:'<svg class="i" viewBox="0 0 24 24"><path d="M21 3v5l-11 9-4 4-3-3 4-4 9-11z"/><path d="M5 13l6 6"/><path d="M14.3 17.3l3.7 3.7 3-3-3.7-3.7"/><path d="M10 5.5 8 3H3v5l3 2.5"/></svg>',
 coin:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.5A2.5 2.5 0 0 0 12 8.5h-1.5a2 2 0 0 0 0 4H13a2 2 0 0 1 0 4h-1.5A2.5 2.5 0 0 1 9 15"/></svg>',
 flame:'<svg class="i" viewBox="0 0 24 24"><path d="M12 12c2-2.96 0-7-1-8 0 3.038-1.773 4.741-3 6-1.226 1.26-2 3.24-2 5a6 6 0 1 0 12 0c0-1.532-1.056-3.94-2-5-1.786 3-2.791 3-4 2z"/></svg>',
 trophy:'<svg class="i" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 4H4v2a3 3 0 0 0 3 3M17 4h3v2a3 3 0 0 1-3 3"/></svg>',
 chev:'<svg class="i" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>',
 back:'<svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
 gift:'<svg class="i" viewBox="0 0 24 24"><path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7"/></svg>',
 check:'<svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>'
};
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.className='show';t.style.opacity=1;t.style.transform='translateX(-50%) translateY(0)';clearTimeout(window._tt);window._tt=setTimeout(function(){t.style.opacity=0;t.style.transform='translateX(-50%) translateY(10px)';},1900);}

var MAT=[{k:'histoire',n:'Histoire',c:'#D63050'},{k:'geo',n:'Géo',c:'#1E6FCC'},{k:'emc',n:'EMC',c:'#C27C0A'},{k:'pse',n:'PSE',c:'#0E9E6E'}];
var wheelState={enabled:{histoire:true,geo:true,emc:true,pse:true},rot:0,spinning:false};

var CURROOM=0;
var JOIN_REQUESTS=[];
function openRoom(i){CURROOM=i;JOIN_REQUESTS=[];go('room');}
function qrSvg(){var r='';for(var y=0;y<11;y++)for(var x=0;x<11;x++){if((x*y+x+y)%3===0||(x<3&&y<3)||(x>7&&y<3)||(x<3&&y>7))r+='<rect x="'+(x*10)+'" y="'+(y*10)+'" width="10" height="10" fill="#111"/>';}return '<svg viewBox="0 0 110 110" style="width:120px;height:120px">'+r+'</svg>';}
var CLASSMATES=['Lilou','Marc','Tom','In\u00e8s','Nadir','Lucas','Emma'];
var ROOMS=[
  {titre:'Room de Sophie',createur:'Sophie',mise:45,joueursActuels:2,joueursTotal:4,type:'Publique',couleur:'var(--pp)',theme:'Al\u00e9atoire',participants:['Sophie','Lilou'],statut:'attente',gagnant:null,scores:null},
  {titre:'Room de Nadir',createur:'Nadir',mise:25,joueursActuels:1,joueursTotal:3,type:'Priv\u00e9e',couleur:'var(--am)',theme:'Histoire',participants:['Nadir'],statut:'attente',gagnant:null,scores:null},
  {titre:'Room de In\u00e8s',createur:'In\u00e8s',mise:100,joueursActuels:6,joueursTotal:8,type:'Live',couleur:'var(--gr)',theme:'G\u00e9o',participants:['In\u00e8s','Lilou','Marc','Tom','Nadir','Lucas'],statut:'attente',gagnant:null,scores:null}
];
var DEFICREATE_STATE={titre:'',mise:45,joueurs:2,theme:'Al\u00e9atoire',type:'Publique',invites:[]};
function setDefiField(field,value){DEFICREATE_STATE[field]=value;}
function pickRoomType(t){DEFICREATE_STATE.type=t;go('deficreate');}
function toggleInvite(p){var i=DEFICREATE_STATE.invites.indexOf(p);if(i===-1)DEFICREATE_STATE.invites.push(p);else DEFICREATE_STATE.invites.splice(i,1);go('deficreate');}
function creerRoomDefi(){
  var input=document.getElementById('roomTitreInput');
  if(input) DEFICREATE_STATE.titre=input.value.trim();
  var couleurs={Publique:'var(--pp)','Priv\u00e9e':'var(--am)',Live:'var(--gr)'};
  var titre=DEFICREATE_STATE.titre||'Room de Soso';
  var participants=['Soso (toi)'].concat(DEFICREATE_STATE.type==='Priv\u00e9e'?DEFICREATE_STATE.invites.slice():[]);
  ROOMS.unshift({titre:titre,createur:'Soso (toi)',mise:DEFICREATE_STATE.mise,joueursActuels:participants.length,joueursTotal:DEFICREATE_STATE.joueurs,type:DEFICREATE_STATE.type,couleur:couleurs[DEFICREATE_STATE.type]||'var(--pp)',theme:DEFICREATE_STATE.theme,participants:participants,statut:'attente',gagnant:null,scores:null});
  CURROOM=0;JOIN_REQUESTS=[];
  var typeCree=DEFICREATE_STATE.type;
  DEFICREATE_STATE={titre:'',mise:45,joueurs:2,theme:'Al\u00e9atoire',type:'Publique',invites:[]};
  if(typeCree==='Live'){toast('Room cr\u00e9\u00e9e \u2014 diffuse le QR');go('roomqr');}
  else if(typeCree==='Priv\u00e9e'){toast('Room cr\u00e9\u00e9e \u2014 invitations pr\u00eates');go('roomlien');}
  else{toast('Room cr\u00e9\u00e9e \u2014 visible dans le lobby');go('room');}
}
function simulerScanDefi(){
  var r=ROOMS[CURROOM];var pool=CLASSMATES.filter(function(p){return r.participants.indexOf(p)===-1;});
  if(!pool.length||r.joueursActuels>=r.joueursTotal){toast('La room est compl\u00e8te');return;}
  var p=pool[Math.floor(Math.random()*pool.length)];r.participants.push(p);r.joueursActuels++;
  toast(p+' a flash\u00e9 le QR');go('roomqr');
}
function copierLienDefi(lien){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(lien).catch(function(){});}toast('Lien copi\u00e9');}
function simulerDemandeRejoindre(){
  var r=ROOMS[CURROOM];var pool=CLASSMATES.filter(function(p){return r.participants.indexOf(p)===-1&&JOIN_REQUESTS.indexOf(p)===-1;});
  if(!pool.length){toast('Plus personne \u00e0 inviter');return;}
  JOIN_REQUESTS.push(pool[Math.floor(Math.random()*pool.length)]);go('room');
}
function admettreJoueur(p){
  var r=ROOMS[CURROOM];var i=JOIN_REQUESTS.indexOf(p);if(i!==-1)JOIN_REQUESTS.splice(i,1);
  if(r.participants.indexOf(p)===-1&&r.joueursActuels<r.joueursTotal){r.participants.push(p);r.joueursActuels++;}
  toast(p+' a rejoint la room');go('room');
}
function lancerManche(){
  var r=ROOMS[CURROOM];
  if(r.joueursActuels<2){toast('Il faut au moins 2 joueurs pour lancer');return;}
  if(!r.scores)r.scores=r.participants.map(function(p){return {pseudo:p,pts:Math.floor(Math.random()*40)+55};});
  go('roomcountdown');
  var n=3;
  var overlay=document.getElementById('main');
  function tick(){
    overlay.querySelector('#cdNum') && (overlay.querySelector('#cdNum').textContent=n>0?n:'GO');
    if(n===0){r.statut='encours';setTimeout(function(){go('roomlive');},500);return;}
    n--;setTimeout(tick,800);
  }
  tick();
}
function validerManche(){
  var r=ROOMS[CURROOM];r.scores.sort(function(a,b){return b.pts-a.pts;});r.gagnant=r.scores[0].pseudo;r.statut='termine';
  afficherPopupGagnant(r);
}
function afficherPopupGagnant(r){
  var cagnotte=r.mise*r.joueursActuels,gain=cagnotte-r.mise;
  var overlay=document.createElement('div');
  overlay.id='popupGagnant';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(20,16,50,.55);display:flex;align-items:center;justify-content:center;z-index:999;animation:fadeInPop .25s ease';
  overlay.innerHTML='<style>@keyframes fadeInPop{from{opacity:0}to{opacity:1}}@keyframes popIn{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}</style>'
    +'<div style="background:#fff;border-radius:20px;padding:32px 28px;max-width:380px;width:90%;text-align:center;animation:popIn .35s cubic-bezier(.34,1.56,.64,1)">'
    +'<div style="width:72px;height:72px;border-radius:50%;background:#FDF3D0;color:var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:34px">'+ICON.trophy+'</div>'
    +'<div class="h1" style="font-size:19px">'+r.gagnant+' remporte la room !</div>'
    +'<div style="font-size:40px;font-weight:800;color:var(--pp);margin:8px 0">+'+gain+'</div>'
    +'<div class="sub" style="margin-bottom:16px">la cagnotte enti\u00e8re (moins sa propre mise)</div>'
    +'<div style="text-align:left;background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:16px">'+r.participants.map(function(p){var g=p===r.gagnant;return '<div class="row" style="padding:6px 0"><div class="av" style="width:24px;height:24px;font-size:11px">'+p[0]+'</div><div style="flex:1;font-weight:700;font-size:12.5px">'+p+'</div><span style="font-weight:800;font-size:12.5px;color:'+(g?'var(--gr)':'var(--re)')+'">'+(g?'+'+gain:'-'+r.mise)+'</span></div>';}).join('')+'</div>'
    +'<button class="btn" style="width:100%;justify-content:center" onclick="fermerPopupGagnant()">Retour aux d\u00e9fis</button>'
    +'</div>';
  document.body.appendChild(overlay);
}
function fermerPopupGagnant(){var o=document.getElementById('popupGagnant');if(o)o.remove();go('defis');}
var PROFQUIZ={actif:true,titre:'Le jeu des puissances',matiere:'Histoire',classe:'Terminale Bac Pro'};
var CLASSPERIOD='trimestre';
function setClassPeriod(p){CLASSPERIOD=p;render();}
var PAGE='hub';
function go(p){PAGE=p;render();document.querySelectorAll('#nav a').forEach(function(a){a.classList.toggle('on',a.dataset.p===p);});window.scrollTo(0,0);}
document.getElementById('nav').addEventListener('click',function(e){var a=e.target.closest('a');if(a)go(a.dataset.p);});

var PAGES={
 hub:function(){return ''
  +'<div class="topbar"><div><div class="h1">Salut Sophie</div><div class="sub">On joue ?</div></div><button class="btn sec" onclick="triggerGain(60)">Tester l\'animation de gain</button></div>'
  +'<div class="kpis">'
   +'<div class="kpi"><div class="ic" style="background:#E0A800">'+ICON.coin+'</div><div><div class="v">512</div><div class="l">Points</div></div></div>'
   +'<div class="kpi"><div class="ic" style="background:#F97316">'+ICON.flame+'</div><div><div class="v">7</div><div class="l">Streak</div></div></div>'
   +'<div class="kpi"><div class="ic" style="background:var(--pp)">'+ICON.star+'</div><div><div class="v">64</div><div class="l">Quiz faits</div></div></div>'
  +'</div>'

function chipPick(el){var pr=el.parentNode;pr.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on');});el.classList.add('on');}
function render(){document.getElementById('main').innerHTML=(PAGES[PAGE]||PAGES.hub)();if(PAGE==='quiz')mountWheel();}
function mountWheel(){var chips=document.getElementById('mchips');chips.innerHTML='';MAT.forEach(function(m){var el=document.createElement('div');el.className='chip'+(wheelState.enabled[m.k]?' on':'');el.innerHTML='<span class="sw" style="background:'+m.c+'"></span>'+m.n;el.onclick=function(){if(wheelState.spinning)return;var act=MAT.filter(function(x){return wheelState.enabled[x.k];});if(wheelState.enabled[m.k]&&act.length<=1)return;wheelState.enabled[m.k]=!wheelState.enabled[m.k];mountWheel();drawWheel();};chips.appendChild(el);});drawWheel();}
function drawWheel(){var w=document.getElementById('wheel');if(!w)return;var act=MAT.filter(function(m){return wheelState.enabled[m.k];});if(!act.length){w.style.background='#EEEDFE';return;}var seg=100/act.length,acc=0,stops=[];act.forEach(function(m){stops.push(m.c+' '+acc+'% '+(acc+seg)+'%');acc+=seg;});w.style.background='conic-gradient('+stops.join(',')+')';w.style.transform='rotate('+wheelState.rot+'deg)';}
function spin(){var act=MAT.filter(function(m){return wheelState.enabled[m.k];});if(wheelState.spinning||!act.length)return;wheelState.spinning=true;document.getElementById('spinBtn').disabled=true;var pick=Math.floor(Math.random()*act.length);var seg=360/act.length;wheelState.rot+=360*5+(360-(pick*seg+seg/2));drawWheel();setTimeout(function(){wheelState.spinning=false;document.getElementById('spinBtn').disabled=false;document.getElementById('spinRes').innerHTML='Th\u00e8me tir\u00e9 dans <b style="color:'+act[pick].c+'">'+act[pick].n+'</b> !';setTimeout(function(){triggerGain(60);},500);},3500);}

function triggerGain(points){
  points = points || 50;
  var layer = document.getElementById('gainlayer');
  // pièces qui tombent
  var syms = ['\u{1FA99}','\u2B50','\u{1F4B0}'];
  for (var i=0;i<18;i++){
    (function(idx){
      var c = document.createElement('div');
      c.className='gcoin';
      c.textContent = syms[idx%3];
      c.style.left = (Math.random()*90+2)+'vw';
      c.style.animationDelay = (Math.random()*0.5)+'s, '+(Math.random()*0.3)+'s';
      c.style.fontSize = (16+Math.random()*14)+'px';
      layer.appendChild(c);
      setTimeout(function(){c.remove();}, 2300);
    })(i);
  }
  // burst central avec compteur animé
  var burst = document.createElement('div');
  burst.className='gburst';
  burst.innerHTML = '<div class="gcard"><div class="gmedal">\u{1F3C6}</div><div style="font-weight:800;font-size:16px">Bien jou\u00e9 !</div><div class="gpts" id="gcount">+0</div><div style="color:var(--ink3);font-size:12.5px;font-weight:600">points cr\u00e9dit\u00e9s</div></div>';
  layer.appendChild(burst);
  var el = burst.querySelector('#gcount');
  var start = 0, dur = 700, t0 = performance.now();
  function step(t){
    var p = Math.min(1,(t-t0)/dur);
    var val = Math.round(points * (1 - Math.pow(1-p,3)));
    el.textContent = '+' + val;
    if(p<1) requestAnimationFrame(step); else el.textContent='+'+points;
  }
  requestAnimationFrame(step);
  setTimeout(function(){
    burst.querySelector('.gcard').classList.add('gout');
    setTimeout(function(){burst.remove();}, 380);
  }, 1900);
}

render();
</script>
