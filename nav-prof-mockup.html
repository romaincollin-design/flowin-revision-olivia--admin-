<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flowin Révision — maquette espace prof</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; min-width: 0; }
  body { margin: 0; font-family: 'DM Sans', system-ui, sans-serif; background: #FAFAFC; color: var(--ink); padding: 16px 6px; min-height: 100vh; }
  :root { --pp:#534AB7; --ppbg:#EEEDFE; --ppln:#CECBF6; --ink:#14162A; --ink2:#3D3F5C; --ink3:#6B7094; --line:#E4E3F0; --bg:#F5F3FF; --gold:#E0A800; --gr:#0E9E6E; --grbg:#E3F7EF; --re:#D63050; --am:#C27C0A; --ambg:#FBEEDA; --bl:#1E6FCC; }
  .wrap { max-width: 900px; width:100%; margin: 0 auto; }
  .title { font-size: 13px; font-weight: 700; color: var(--ink3); text-transform: uppercase; margin-bottom: 4px; }
  .subtitle { font-size: 20px; font-weight: 800; margin-bottom: 20px; }
  .toggle { display: flex; gap: 8px; margin-bottom: 24px; max-width: 320px; }
  .toggle button { flex: 1; padding: 10px; border-radius: 10px; border: 1.5px solid var(--line); background: white; color: var(--ink3); font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; }
  .toggle button.active { border-color: var(--ppln); background: var(--ppbg); color: var(--pp); }
  #phone-wrap { width: 100%; max-width: 300px; margin: 0 auto; }
  #frame-mobile { width: 100%; aspect-ratio: 300/580; border: 7px solid var(--ink); border-radius: 36px; overflow: hidden; background: var(--bg); position: relative; display: flex; flex-direction: column; box-shadow: 0 20px 50px -20px rgba(20,20,45,.3); }
  .notch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 100px; height: 22px; background: var(--ink); border-radius: 12px; z-index: 5; }
  .statusbar { padding: 16px 26px 4px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; background: white; flex-shrink: 0; }
  .mtop { background: white; border-bottom: 1px solid var(--line); padding: 12px 16px; display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .mtop .brand{flex:1;}
  .brand{display:flex;align-items:center;gap:7px;}
  .brand-icon{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#5B52C9,#7F77DD);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-name{font-weight:700;font-size:12px;}
  #mobile-screen { padding: 18px 14px; flex: 1; overflow-y: auto; }
  #bottom-nav { display: flex; background: white; border-top: 1px solid var(--line); flex-shrink: 0; padding: 5px 2px 8px; }
  .bnav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; border: none; background: transparent; padding: 5px 2px; cursor: pointer; font-family: inherit; }
  .bnav-item span { font-size: 7.5px; font-weight: 700; color: var(--ink3); }
  .bnav-item.active span { color: var(--pp); }
  #frame-desktop { display:none; border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .dlayout{display:flex;min-height:560px;}
  .sidebar{width:170px;background:white;border-right:1px solid var(--line);padding:16px 11px;display:flex;flex-direction:column;flex-shrink:0;}
  .sidebar .brand{padding:0 7px 20px;}
  #desktop-topbar{display:none;align-items:center;gap:8px;padding:16px 24px 0;}
  #desktop-screen{padding:24px;background:var(--bg);}
  nav button{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;border:none;text-align:left;cursor:pointer;width:100%;font-size:11.5px;font-weight:700;background:transparent;color:var(--ink2);font-family:inherit;margin-bottom:1px;}
  nav button.active{background:var(--ppbg);color:var(--pp);}
  .card { background: white; border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .h-title { font-size: 20px; font-weight: 800; margin: 2px 0 16px; }
  .h-greet { color: var(--ink3); font-size: 13px; }
  .icon-sq { border-radius: 11px; display: flex; align-items: center; justify-content: center; color: white; flex-shrink: 0; }
  .kpi-v { font-size: 17px; font-weight: 800; line-height: 1; }
  .kpi-l { font-size: 9px; font-weight: 700; color: var(--ink3); text-transform: uppercase; margin-top: 4px; }
  .row { display:flex; align-items:center; gap:9px; }
  .sec-title { font-size: 14px; font-weight: 800; margin-bottom: 10px; }
  .chip { display:inline-flex; align-items:center; gap:5px; border:1.5px solid var(--line); border-radius:999px; padding:5px 11px; font-size:10.5px; font-weight:700; color:var(--ink2); background:white; font-family:inherit; cursor:pointer; }
  .chip.active { border-color:var(--ppln); background:var(--ppbg); color:var(--pp); }
  .badge { font-size:9px; font-weight:800; padding:3px 9px; border-radius:999px; }
  .btn { display:block; width:100%; background:var(--pp); color:white; font-weight:800; font-size:12.5px; padding:12px; border-radius:12px; border:none; font-family:inherit; cursor:pointer; }
  .btn-outline { display:block; width:100%; border:1.5px solid var(--line); color:var(--ink2); background:transparent; font-weight:700; font-size:11.5px; padding:10px; border-radius:12px; font-family:inherit; cursor:pointer; }
  .field-label{font-size:9.5px;font-weight:800;color:var(--ink3);text-transform:uppercase;margin-bottom:4px;display:block;}
  input[type=text],input[type=email],input[type=password],textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:12px;font-family:inherit;margin-bottom:12px;}
  .note { margin-top: 24px; font-size: 12.5px; color: var(--ink3); max-width: 700px; line-height: 1.6; }
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">Flowin Révision</div>
  <div class="subtitle">Maquette navigable — espace prof</div>
  <div class="toggle">
    <button id="btn-mobile" class="active" onclick="setMode('mobile')">Mobile</button>
    <button id="btn-desktop" onclick="setMode('desktop')">Desktop</button>
  </div>
  <div id="phone-wrap">
    <div id="frame-mobile">
      <div class="notch"></div>
      <div class="statusbar">
        <span>9:41</span>
        <span style="display:flex; align-items:center; gap:4px;">
          <svg viewBox="0 0 18 12" width="16" height="11"><rect x="0" y="7" width="3" height="5" rx="0.5" fill="var(--ink)"/><rect x="4.5" y="5" width="3" height="7" rx="0.5" fill="var(--ink)"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="var(--ink)"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="var(--ink)"/></svg>
          <svg viewBox="0 0 24 12" width="21" height="11"><rect x="1" y="1" width="19" height="10" rx="2.5" stroke="var(--ink)" stroke-width="1" fill="none"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.2" fill="var(--ink)"/><rect x="21" y="4" width="1.5" height="4" rx="0.7" fill="var(--ink)"/></svg>
        </span>
      </div>
      <div class="mtop">
        <button id="back-btn" onclick="goBack()" style="border:none;background:none;padding:4px;cursor:pointer;display:none;">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="brand"><div class="brand-icon"><svg viewBox="0 0 24 24" width="12" height="12" fill="white"><path d="M12 2 15 9l7 .5-5.5 4.5L18 21l-6-3.8L6 21l1.5-7L2 9.5 9 9z"/></svg></div><span class="brand-name">Flowin Révision</span></div>
      </div>
      <div id="mobile-screen"></div>
      <div id="bottom-nav"></div>
    </div>
  </div>
  <div id="frame-desktop">
    <div class="dlayout">
      <div class="sidebar">
        <div class="brand"><div class="brand-icon"><svg viewBox="0 0 24 24" width="12" height="12" fill="white"><path d="M12 2 15 9l7 .5-5.5 4.5L18 21l-6-3.8L6 21l1.5-7L2 9.5 9 9z"/></svg></div><span class="brand-name">Flowin Révision</span></div>
        <nav id="desktop-nav"></nav>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
        <div id="desktop-topbar"><button onclick="goBack()" style="border:none;background:var(--ppbg);color:var(--pp);padding:6px 10px;border-radius:9px;cursor:pointer;font-family:inherit;font-weight:700;font-size:12px;">← Retour</button></div>
        <div id="desktop-screen" style="flex:1;overflow-y:auto;"></div>
      </div>
    </div>
  </div>
  <div class="note">Reproduction de l'espace prof réel (classes, cagnotte, réglages déjà branchés en vrai sur flowin-revisions.vercel.app) + nouveauté proposée : constructeur de quiz et room en direct.</div>
</div>

// ---- Génération SANS IA : heuristique par texte à trous (cloze deletion) ----
// Principe : on repère dans chaque phrase une date, un nombre, ou une notion (mot capitalisé hors début de phrase),
// on la transforme en "trou" à deviner, et on fabrique des mauvaises réponses plausibles (autres notions du même texte,
// ou variations numériques). C'est un algorithme, pas de l'IA : il ne comprend pas le sens, il repère des motifs.
var MOTS_VIDES = ['Le','La','Les','Un','Une','Des','Ce','Cette','Ces','Il','Elle','Ils','Elles','Mais','Or','Donc','Car','Cependant','Ainsi','Puis','Alors','Quand','Dans','Pour','Avec','Sans','Sur','Sous','Entre','Nous','Vous','On'];
function genererQuestionsSansIA(texte, nbQuestions){
  nbQuestions = nbQuestions || 5;
  var phrases = texte.replace(/\n/g,' ').split(/(?<=[.!?])\s+/).filter(function(p){ return p.trim().length > 20; });
  var candidats = [];
  var tousTermes = [];

  phrases.forEach(function(phrase){
    var mots = phrase.trim().split(/\s+/);
    mots.forEach(function(m,i){
      var propre = m.replace(/[^\wÀ-ÿ-]/g,'');
      if (i>0 && propre.length>2 && /^[A-ZÀ-Ý]/.test(propre) && MOTS_VIDES.indexOf(propre)===-1) tousTermes.push(propre);
    });
  });

  phrases.forEach(function(phrase){
    var matchDate = phrase.match(/\b(1[0-9]{3}|20[0-9]{2})\b/);
    var matchPourcent = phrase.match(/\b(\d+(?:[.,]\d+)?)\s?%/);
    var mots = phrase.trim().split(/\s+/);
    var terme = null;
    for (var i=1;i<mots.length;i++){
      var propre = mots[i].replace(/[^\wÀ-ÿ-]/g,'');
      if (propre.length>2 && /^[A-ZÀ-Ý]/.test(propre) && MOTS_VIDES.indexOf(propre)===-1){ terme = propre; break; }
    }
    if (matchDate) candidats.push({type:'date', reponse:matchDate[0], phrase:phrase});
    else if (matchPourcent) candidats.push({type:'pourcent', reponse:matchPourcent[0], phrase:phrase});
    else if (terme) candidats.push({type:'terme', reponse:terme, phrase:phrase});
  });

  function distracteurs(c){
    if (c.type==='date'){
      var a=parseInt(c.reponse);
      var vals=[a-(2+Math.floor(Math.random()*6)), a+(2+Math.floor(Math.random()*6)), a+(10+Math.floor(Math.random()*15))];
      return vals.map(String);
    }
    if (c.type==='pourcent'){
      var v=parseFloat(c.reponse.replace(',','.'));
      return [Math.round(v*0.5)+'%', Math.round(Math.min(99,v*1.6))+'%', Math.round(Math.min(99,v+15))+'%'];
    }
    var pool = tousTermes.filter(function(t){return t!==c.reponse;});
    pool.sort(function(){return Math.random()-0.5;});
    var uniques=[];
    pool.forEach(function(t){ if(uniques.indexOf(t)===-1) uniques.push(t); });
    return uniques.slice(0,3);
  }

  return candidats.slice(0, nbQuestions).map(function(c){
    var blank = c.phrase.replace(c.reponse, '_____');
    var mauvaises = distracteurs(c);
    while (mauvaises.length<3) mauvaises.push('Aucune de ces r\u00e9ponses');
    var toutes = mauvaises.slice(0,3).concat([c.reponse]);
    toutes.sort(function(){return Math.random()-0.5;});
    return {q:'Compl\u00e8te : "'+blank.trim()+'"', opts:toutes, bon:toutes.indexOf(c.reponse), garder:true, origine:'auto-sans-ia'};
  });
}
function genererSansIA(){
  if (!iaPrompt || iaPrompt.trim().length<40){ derniereActionBanque = null; alert('Colle un texte un peu plus long (quelques phrases avec dates, chiffres ou notions) pour que la g\u00e9n\u00e9ration fonctionne.'); return; }
  var generees = genererQuestionsSansIA(iaPrompt, 5);
  if (!generees.length){ alert('Aucun motif exploitable trouv\u00e9 (pas de date, chiffre ou notion cl\u00e9 rep\u00e9r\u00e9). Essaie un texte plus factuel.'); return; }
  questionsQuiz = questionsQuiz.concat(generees);
  derniereActionBanque = generees.length+' question(s) g\u00e9n\u00e9r\u00e9e(s) sans IA \u2014 relis-les avant de garder';
  modeCreation = 'manuel';

function roomSuivant(){
  arreterMinuteurRoom();
  // Clôture la question en cours : simule qui a bien/mal répondu (pondéré par le score global du pseudo, pour rester cohérent)
  var correct=[], incorrect=[];
  joueursConnectes.forEach(function(p){
    var s = SCORES.filter(function(x){return x.pseudo===p;})[0];
    var proba = s ? Math.min(0.9, 0.4 + s.pts/150) : 0.6;
    if (Math.random() < proba) correct.push(p); else incorrect.push(p);
  });
  MATRICE_REPONSES[questionActuelle-1] = {correct:correct, incorrect:incorrect};
  enPause = false;

  if (questionActuelle<TOTAL_Q) { questionActuelle++; etapeEleveRoom='question'; reponsesRecues=0; demarrerMinuteurRoom(); }
  else {
    etapeRoom='resultats'; etapeEleveRoom='resultats';
    if (QUIZ_EN_COURS) {
      QUIZ_EN_COURS.statut='termin\u00e9';
      QUIZ_EN_COURS.reponduPar=joueursConnectes.length;
      QUIZ_EN_COURS.moyenne=Math.round(SCORES.reduce(function(a,s){return a+s.pts;},0)/SCORES.length)+'%';
      QUIZ_EN_COURS.matrice = MATRICE_REPONSES.slice();
      QUIZ_EN_COURS.questionsTexte = QUESTIONS_MANCHE.map(function(q){return q.q;});
      QUIZ_EN_COURS.joueurs = joueursConnectes.slice();
    }
  }
  selectScreen('room-ouverture');
}

function calendrierReponses(matrice, pseudos, nbQuestions){
  var html = '<div style="overflow-x:auto;"><table style="border-collapse:collapse;width:100%;">'
    + '<tr><td></td>' + Array.apply(null,{length:nbQuestions}).map(function(_,qi){return '<td style="text-align:center;font-size:8.5px;font-weight:800;color:var(--ink3);padding:2px 3px;">Q'+(qi+1)+'</td>';}).join('') + '</tr>';
  pseudos.forEach(function(p){
    html += '<tr><td style="font-size:9.5px;font-weight:700;padding:3px 6px 3px 0;white-space:nowrap;">'+p+'</td>';
    for (var qi=0; qi<nbQuestions; qi++){
      var m = matrice[qi];
      var statut = !m ? 'attente' : (m.correct.indexOf(p)!==-1 ? 'bon' : (m.incorrect.indexOf(p)!==-1 ? 'faux' : 'attente'));
      var couleur = statut==='bon' ? 'var(--gr)' : (statut==='faux' ? 'var(--pp)' : 'var(--line)');
      html += '<td style="padding:2px;"><div style="width:16px;height:16px;border-radius:4px;background:'+couleur+';margin:0 auto;"></div></td>';
    }
    html += '</tr>';
  });
  html += '</table></div>'
    + '<div style="display:flex;gap:14px;margin-top:8px;">'
      + '<span style="display:flex;align-items:center;gap:4px;font-size:9px;color:var(--ink3);"><span style="width:10px;height:10px;border-radius:3px;background:var(--gr);display:inline-block;"></span>Bonne réponse</span>'
      + '<span style="display:flex;align-items:center;gap:4px;font-size:9px;color:var(--ink3);"><span style="width:10px;height:10px;border-radius:3px;background:var(--pp);display:inline-block;"></span>Mauvaise réponse</span>'
      + '<span style="display:flex;align-items:center;gap:4px;font-size:9px;color:var(--ink3);"><span style="width:10px;height:10px;border-radius:3px;background:var(--line);display:inline-block;"></span>Pas encore</span>'
    + '</div>';
  return html;
}

function svgCourbe(series, labels, opts){
  opts = opts || {};
  var w = opts.w || 280, h = opts.h || 130, padL = 26, padB = 16, padT = 8, padR = 6;
  var chartW = w - padL - padR, chartH = h - padT - padB;
  var toutesValeurs = [];
  series.forEach(function(s){ toutesValeurs = toutesValeurs.concat(s.valeurs); });
  var maxV = Math.max.apply(null, toutesValeurs.concat([1])) * 1.15;
  function px(i){ return padL + (labels.length>1 ? (i/(labels.length-1)) : 0.5) * chartW; }
  function py(v){ return padT + chartH - (v/maxV) * chartH; }

  var gridlines = '';
  for (var g=0; g<=3; g++){
    var val = Math.round((maxV/3)*g);
    var yy = py(val);
    gridlines += '<line x1="'+padL+'" y1="'+yy+'" x2="'+(w-padR)+'" y2="'+yy+'" stroke="#E4E3F0" stroke-width="1"/>';
    gridlines += '<text x="'+(padL-4)+'" y="'+yy+'" font-size="7" fill="#6B7094" text-anchor="end" dominant-baseline="middle">'+val+'</text>';
  }
  var axeX = '<line x1="'+padL+'" y1="'+(padT+chartH)+'" x2="'+(w-padR)+'" y2="'+(padT+chartH)+'" stroke="#6B7094" stroke-width="1"/>';
  var axeY = '<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(padT+chartH)+'" stroke="#6B7094" stroke-width="1"/>';
  var xLabels = labels.map(function(l,i){ return '<text x="'+px(i)+'" y="'+(h-3)+'" font-size="7" fill="#6B7094" text-anchor="middle">'+l+'</text>'; }).join('');

  var lignes = series.map(function(s){
    var pts = s.valeurs.map(function(v,i){ return px(i)+','+py(v); }).join(' ');
    var pastilles = s.valeurs.map(function(v,i){ return '<circle cx="'+px(i)+'" cy="'+py(v)+'" r="2.5" fill="'+s.couleur+'"/>'; }).join('');
    return '<polyline points="'+pts+'" fill="none" stroke="'+s.couleur+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' + pastilles;
  }).join('');

  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block;">' + gridlines + axeX + axeY + lignes + xLabels + '</svg>';
}
function svgSparkline(valeurs, couleur, w, h){
  w = w || 100; h = h || 26;
  var maxV = Math.max.apply(null, valeurs), minV = Math.min.apply(null, valeurs);
  var range = (maxV - minV) || 1;
  function px(i){ return valeurs.length>1 ? (i/(valeurs.length-1))*w : w/2; }
  function py(v){ return h - ((v-minV)/range) * (h-4) - 2; }
  var pts = valeurs.map(function(v,i){ return px(i)+','+py(v); }).join(' ');
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:'+w+'px;height:'+h+'px;display:block;flex-shrink:0;"><polyline points="'+pts+'" fill="none" stroke="'+couleur+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function genererTendance(valeurFinale){
  // Génère une petite série plausible de 4 points menant à la valeur actuelle (pas d'historique réel en mock)
  var depart = valeurFinale - (8 + Math.abs(valeurFinale)*0.4);
  return [depart, depart + (valeurFinale-depart)*0.4, depart + (valeurFinale-depart)*0.7, valeurFinale];
}

    + '</div>'
    + '<div class="sec-title">Activité récente</div>'
    + activiteRecente.map(function(a){
        return '<button onclick="selectScreen(\'statistiques\')" class="card" style="margin-bottom:8px;width:100%;text-align:left;font-family:inherit;cursor:pointer;">'
          + '<div class="row" style="justify-content:space-between;margin-bottom:3px;"><span style="font-size:11.5px;font-weight:800;">'+a.titre+'</span><span style="font-size:9px;color:var(--ink3);">'+a.quand+'</span></div>'
          + '<div style="font-size:10px;color:var(--ink3);">'+a.classe+' · <span style="color:var(--gr);font-weight:700;">'+a.pts+'</span></div>'
        + '</button>';
      }).join('');
}
subScreens['cours-banque'] = function(){
  return '<div class="h-title">Mes cours</div>'
    + '<div style="font-size:10.5px;color:var(--ink3);margin-bottom:14px;">D\u00e9pose le contenu de tes cours, g\u00e9n\u00e8re des questions, et enrichis la banque partag\u00e9e.</div>'
    + '<button onclick="ouvrirNouveauCours()" class="btn" style="margin-bottom:14px;">'+icon(ICONS.plus,{w:14,stroke:'white'})+' Ajouter un cours</button>'
    + (MES_COURS.length ? MES_COURS.map(function(c){
        return '<button onclick="ouvrirCours(\''+c.id+'\')" class="card" style="width:100%;text-align:left;font-family:inherit;cursor:pointer;margin-bottom:8px;">'
          + '<div class="row" style="justify-content:space-between;margin-bottom:3px;"><span style="font-size:11.5px;font-weight:800;">'+c.titre+'</span><span class="badge" style="background:var(--ppbg);color:var(--pp);">'+c.matiere+'</span></div>'
          + '<div style="font-size:10px;color:var(--ink3);">'+c.quand+' \u00b7 '+c.questionsGenerees.length+' question(s) g\u00e9n\u00e9r\u00e9e(s)</div>'
        + '</button>';
      }).join('') : '<div style="font-size:10.5px;color:var(--ink3);margin-bottom:14px;">Aucun cours ajout\u00e9 pour l\'instant.</div>')
    + '<button onclick="selectScreen(\'banque-questions\')" class="btn-outline" style="margin-top:6px;">Voir la banque de questions ('+BANQUE_GENERALE.length+')</button>';
};
subScreens['nouveau-cours'] = function(){
  return '<div class="h-title">Ajouter un cours</div>'
    + '<span class="field-label">Titre</span><input type="text" value="'+nouveauCoursForm.titre+'" oninput="majNouveauCours(\'titre\',this.value)" placeholder="Ex : Le Front populaire"/>'
    + '<span class="field-label">Mati\u00e8re</span>'
    + '<div style="display:flex;gap:6px;margin-bottom:12px;">' + MATIERES_LISTE.map(function(m){return '<button onclick="majNouveauCours(\'matiere\',\''+m+'\')" class="chip'+(nouveauCoursForm.matiere===m?' active':'')+'" style="flex:1;justify-content:center;">'+m+'</button>';}).join('') + '</div>'
    + '<span class="field-label">Contenu du cours</span>'
    + '<textarea rows="8" oninput="majNouveauCours(\'contenu\',this.value)" placeholder="Colle ici le texte du cours (id\u00e9alement avec des dates, chiffres et notions cl\u00e9s \u2014 \u00e7a aide beaucoup la g\u00e9n\u00e9ration de questions)">'+nouveauCoursForm.contenu+'</textarea>'
    + '<button onclick="enregistrerCours()" class="btn" style="margin-top:6px;">Enregistrer le cours</button>';
};
subScreens['detail-cours'] = function(){
  var c = COURS_COURANT;
  if (!c) return '<div class="h-title">Cours introuvable</div>';
  var html = '<div class="h-title">'+c.titre+'</div>'
    + '<div style="font-size:10.5px;color:var(--ink3);margin-bottom:12px;"><span class="badge" style="background:var(--ppbg);color:var(--pp);">'+c.matiere+'</span> \u00b7 '+c.quand+'</div>'
    + '<div class="card" style="margin-bottom:12px;"><div style="font-size:11px;line-height:1.6;color:var(--ink2);">'+c.contenu+'</div></div>'
    + '<button onclick="genererQuestionsPourCours()" class="btn" style="margin-bottom:6px;">'+icon(ICONS.sparkle,{w:14,stroke:'white'})+' G\u00e9n\u00e9rer des questions sans IA</button>';

  if (derniereActionBanque){ html += '<div class="card" style="background:var(--grbg);border-color:#B7E4CE;margin-bottom:10px;"><div style="font-size:10px;color:var(--gr);font-weight:800;">'+derniereActionBanque+'</div></div>'; derniereActionBanque=null; }

  if (c.questionsGenerees.length){
    html += '<div class="sec-title" style="margin-top:10px;">Questions g\u00e9n\u00e9r\u00e9es ('+c.questionsGenerees.length+')</div>'
      + c.questionsGenerees.map(function(q,qi){
          if (questionCoursEnEdition===qi){
            return '<div class="card" style="margin-bottom:8px;">'
              + '<span class="field-label">Question</span><input type="text" id="edit-cours-q-'+qi+'" value="'+q.q+'"/>'
              + '<span class="field-label">4 propositions (coche la bonne)</span>'
              + q.opts.map(function(o,oi){return '<div class="row" style="margin-bottom:6px;"><input type="radio" name="edit-cours-bon-'+qi+'" value="'+oi+'" '+(oi===q.bon?'checked':'')+'/><input type="text" id="edit-cours-opt-'+qi+'-'+oi+'" value="'+o+'" style="margin-bottom:0;flex:1;"/></div>';}).join('')
              + '<button onclick="enregistrerEditionQuestionCours('+qi+', document.getElementById(\'edit-cours-q-'+qi+'\').value, ['+q.opts.map(function(o,oi){return 'document.getElementById(\'edit-cours-opt-'+qi+'-'+oi+'\').value';}).join(',')+'], Number(document.querySelector(\'input[name=edit-cours-bon-'+qi+']:checked\').value))" class="btn" style="margin-top:2px;">Enregistrer</button>'
            + '</div>';
          }
          return '<div class="card" style="margin-bottom:8px;">'
            + '<div style="font-size:11px;font-weight:700;margin-bottom:4px;">'+q.q+'</div>'
            + q.opts.map(function(o,oi){return '<div style="font-size:10px;padding:2px 0;color:'+(oi===q.bon?'var(--gr)':'var(--ink3)')+';font-weight:'+(oi===q.bon?'800':'400')+';">'+(oi===q.bon?'\u2713 ':'\u2022 ')+o+'</div>';}).join('')
            + '<div style="display:flex;gap:6px;margin-top:6px;"><button onclick="ouvrirEditionQuestionCours('+qi+')" class="btn-outline" style="flex:1;padding:6px;font-size:10px;">Modifier</button><button onclick="retirerQuestionCours('+qi+')" class="btn-outline" style="flex:1;padding:6px;font-size:10px;color:var(--re);">Retirer</button></div>'
          + '</div>';
        }).join('')
      + '<button onclick="ajouterQuestionsBanque()" class="btn-outline" style="margin-top:4px;">Ajouter \u00e0 la banque de questions</button>'
      + '<button onclick="creerQuizDepuisCours()" class="btn" style="margin-top:8px;">Cr\u00e9er un quiz avec ces questions</button>';
  }
  return html;
};
subScreens['banque-questions'] = function(){
  var matieres = {};
  BANQUE_GENERALE.forEach(function(q){ (matieres[q.mat]=matieres[q.mat]||[]).push(q); });
  return '<div class="h-title">Banque de questions</div>'
    + '<div style="font-size:10.5px;color:var(--ink3);margin-bottom:14px;">'+BANQUE_GENERALE.length+' questions, issues de la classe mod\u00e8le \u00ab '+CLASSE_MODELE+' \u00bb et des cours ajout\u00e9s par les profs.</div>'
    + Object.keys(matieres).map(function(m){
        return '<div class="sec-title">'+m+' ('+matieres[m].length+')</div>'
          + matieres[m].slice(0,4).map(function(q){
              return '<div class="card" style="margin-bottom:6px;"><div style="font-weight:700;font-size:11px;">'+q.q+'</div></div>';
            }).join('');
      }).join('')
    + '<button onclick="modeCreation=\'banque\';selectScreen(\'nouveau-quiz\')" class="btn" style="margin-top:6px;">Créer un quiz depuis la banque</button>';
};
subScreens['distribution-manuelle'] = function(){
  return '<div class="h-title">Distribution manuelle</div>'
    + '<div style="display:flex;gap:6px;margin-bottom:14px;">'
      + '<button class="chip active" style="flex:1;justify-content:center;">Un élève</button>'
      + '<button class="chip" style="flex:1;justify-content:center;">Toute la classe</button>'
    + '</div>'
    + '<span class="field-label">Pseudo</span><input type="text" placeholder="Ex : Mailys"/>'
    + '<span class="field-label">Points</span><input type="text" placeholder="20"/>'
    + '<button class="btn">Générer le QR de remise</button>';
};
var REGLES_JEU = { pointsBonneReponse: 10, bonusStreak: 2, nbReponsesParDefaut: 4, nbQuestionsParDefaut: 5, dureeParDefaut: 15 };
var REGLES_DISTRIB = { parClasse: 500, ajustementEcart: 15, pointsProgression: 25 };
function majRegleJeu(champ, val){ REGLES_JEU[champ] = Number(val); selectScreen('parametres'); }
function majRegleDistrib(champ, val){ REGLES_DISTRIB[champ] = Number(val); selectScreen('parametres'); }
function screenParametres(){
  return '<div class="h-title">Réglages du jeu</div>'

    + '<div class="sec-title" style="margin-top:2px;">Mécanique des quiz</div>'
    + '<div class="card" style="margin-bottom:8px;"><span class="field-label">Points par bonne réponse</span><input type="text" value="'+REGLES_JEU.pointsBonneReponse+'" oninput="majRegleJeu(\'pointsBonneReponse\', this.value)"/></div>'
    + '<div class="card" style="margin-bottom:8px;"><span class="field-label">Bonus streak</span><input type="text" value="'+REGLES_JEU.bonusStreak+'" oninput="majRegleJeu(\'bonusStreak\', this.value)"/></div>'
    + '<div class="card" style="margin-bottom:8px;"><span class="field-label">Nombre de réponses par défaut</span><input type="text" value="'+REGLES_JEU.nbReponsesParDefaut+'" oninput="majRegleJeu(\'nbReponsesParDefaut\', this.value)"/></div>'
    + '<div class="card" style="margin-bottom:8px;"><span class="field-label">Nombre de questions par défaut</span><input type="text" value="'+REGLES_JEU.nbQuestionsParDefaut+'" oninput="majRegleJeu(\'nbQuestionsParDefaut\', this.value)"/></div>'
    + '<div class="card" style="margin-bottom:14px;"><span class="field-label">Durée par question (s)</span><input type="text" value="'+REGLES_JEU.dureeParDefaut+'" oninput="majRegleJeu(\'dureeParDefaut\', this.value)"/></div>'

    + '<div class="sec-title">Règles de distribution de la cagnotte</div>'
    + '<div class="card" style="margin-bottom:8px;">'
      + '<div class="row" style="justify-content:space-between;"><span style="font-size:11px;font-weight:700;">Points alloués par classe</span><span style="font-size:11px;font-weight:800;color:var(--pp);">'+REGLES_DISTRIB.parClasse+' pts</span></div>'
      + '<input type="range" min="0" max="1000" step="10" value="'+REGLES_DISTRIB.parClasse+'" oninput="majRegleDistrib(\'parClasse\', this.value)" style="width:100%;margin-top:6px;"/>'
    + '</div>'
    + '<div class="card" style="margin-bottom:8px;">'
      + '<div class="row" style="justify-content:space-between;"><span style="font-size:11px;font-weight:700;">Ajustement selon l\'écart entre élèves</span><span style="font-size:11px;font-weight:800;color:var(--pp);">'+REGLES_DISTRIB.ajustementEcart+' pts</span></div>'
      + '<div style="font-size:9.5px;color:var(--ink3);margin-top:2px;">Points bonus pour resserrer les écarts de la classe</div>'
      + '<input type="range" min="0" max="100" step="5" value="'+REGLES_DISTRIB.ajustementEcart+'" oninput="majRegleDistrib(\'ajustementEcart\', this.value)" style="width:100%;margin-top:6px;"/>'
    + '</div>'
    + '<div class="card">'
      + '<div class="row" style="justify-content:space-between;"><span style="font-size:11px;font-weight:700;">Points de progression</span><span style="font-size:11px;font-weight:800;color:var(--pp);">'+REGLES_DISTRIB.pointsProgression+' pts</span></div>'
      + '<div style="font-size:9.5px;color:var(--ink3);margin-top:2px;">Récompense automatique quand un élève progresse</div>'
      + '<input type="range" min="0" max="100" step="5" value="'+REGLES_DISTRIB.pointsProgression+'" oninput="majRegleDistrib(\'pointsProgression\', this.value)" style="width:100%;margin-top:6px;"/>'
    + '</div>';
}

// ---------- Navigation ----------
var items = [
  {k:'accueil', label:'Accueil', icon:ICONS.home, render:screenAccueilProf},
  {k:'classes', label:'Classes', icon:ICONS.classe, render:screenClasses},
  {k:'cagnotte', label:'Cagnotte', icon:ICONS.cagnotte, render:screenCagnotte},
  {k:'parametres', label:'Réglages', icon:ICONS.reglages, render:screenParametres}
];
var current='accueil', activeSub=null;
function isMainItem(k){return items.some(function(i){return i.k===k;});}
function findScreen(k){var it=items.filter(function(i){return i.k===k;})[0];if(it)return it;if(subScreens[k])return{k:k,render:subScreens[k]};return items[0];}
function iconSvg(p,a){return icon(p,{w:15,stroke:a?'#534AB7':'#6B7094'});}
function boutonDefiRaccourci(dense){
  var actif = activeSub==='nouveau-quiz';
  var classe = dense ? ('bnav-item'+(actif?' active':'')) : (actif?'active':'');
  var styleDesktop = dense ? '' : 'display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;border:none;text-align:left;cursor:pointer;width:100%;font-size:11.5px;font-weight:700;background:'+(actif?'var(--ppbg)':'transparent')+';color:'+(actif?'var(--pp)':'var(--ink2)')+';font-family:inherit;margin-bottom:1px;';
  return '<button class="'+classe+'" onclick="selectScreen(\'nouveau-quiz\')" style="'+styleDesktop+'">'+iconSvg(ICONS.sword,actif)+'<span>Défi</span></button>';
}
function renderDesktopNav(){
  var html = items.slice(0,2).map(function(it){var a=it.k===current&&!activeSub;return '<button class="'+(a?'active':'')+'" onclick="selectScreen(\''+it.k+'\')">'+iconSvg(it.icon,a)+'<span>'+it.label+'</span></button>';}).join('');
  html += boutonDefiRaccourci(false);
  html += items.slice(2).map(function(it){var a=it.k===current&&!activeSub;return '<button class="'+(a?'active':'')+'" onclick="selectScreen(\''+it.k+'\')">'+iconSvg(it.icon,a)+'<span>'+it.label+'</span></button>';}).join('');
  document.getElementById('desktop-nav').innerHTML = html;
}
function renderDesktopScreen(){document.getElementById('desktop-screen').innerHTML=findScreen(activeSub||current).render();}
function renderBottomNav(){
  var html = items.slice(0,2).map(function(it){var a=it.k===current&&!activeSub;return '<button class="bnav-item'+(a?' active':'')+'" onclick="selectScreen(\''+it.k+'\')">'+iconSvg(it.icon,a)+'<span>'+it.label+'</span></button>';}).join('');
  html += boutonDefiRaccourci(true);
  html += items.slice(2).map(function(it){var a=it.k===current&&!activeSub;return '<button class="bnav-item'+(a?' active':'')+'" onclick="selectScreen(\''+it.k+'\')">'+iconSvg(it.icon,a)+'<span>'+it.label+'</span></button>';}).join('');
  document.getElementById('bottom-nav').innerHTML = html;
}
function renderMobileScreenContent(){document.getElementById('mobile-screen').innerHTML=findScreen(activeSub||current).render();}
function updateChrome(){var b=!!activeSub;document.getElementById('back-btn').style.display=b?'block':'none';document.getElementById('desktop-topbar').style.display=b?'flex':'none';}
function goBack(){if(activeSub){activeSub=null;renderMobileScreenContent();renderDesktopScreen();updateChrome();}}
function selectScreen(k){if(isMainItem(k)){current=k;activeSub=null;}else{activeSub=k;}renderDesktopNav();renderDesktopScreen();renderBottomNav();renderMobileScreenContent();updateChrome();}
function setMode(m){document.getElementById('frame-mobile').style.display=m==='mobile'?'flex':'none';document.getElementById('frame-desktop').style.display=m==='desktop'?'block':'none';document.getElementById('btn-mobile').className=m==='mobile'?'active':'';document.getElementById('btn-desktop').className=m==='desktop'?'active':'';}

renderDesktopNav();renderDesktopScreen();renderBottomNav();renderMobileScreenContent();updateChrome();setMode('mobile');
</script>
</body>
</html>
