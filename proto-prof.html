<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowin Révision — Espace professeur (prototype)</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pp:#534AB7;--pp2:#7F77DD;--ppbg:#EEEDFE;--ppln:#AFA9EC;--ink:#14162A;--ink2:#3D4268;--ink3:#8B90B8;--surf:#fff;--bg:#F3F3F9;--line:rgba(0,0,0,.08);--gr:#0E9E6E;--grbg:#E4F7F0;--am:#C27C0A;--re:#D63050;--bl:#1E6FCC;--gold:#E0A800;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,sans-serif;background:#E9E9F2;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
svg.i{width:1em;height:1em;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.12em}
.device{width:390px;height:800px;max-height:94vh;background:#0B0D1A;border-radius:44px;padding:12px;box-shadow:0 40px 80px -24px rgba(83,74,183,.5)}
.viewport{width:100%;height:100%;background:var(--bg);border-radius:33px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.status{display:flex;justify-content:space-between;padding:13px 24px 4px;font-size:13px;font-weight:700;flex-shrink:0}
.status .dd{display:flex;gap:3px;align-items:center}.status .dd i{width:4px;height:4px;border-radius:50%;background:var(--ink3);display:block}
.screen{flex:1;overflow-y:auto;padding:6px 20px 90px}
.screen::-webkit-scrollbar{width:0}
.tabbar{position:absolute;bottom:0;left:0;right:0;height:74px;background:var(--surf);border-top:1px solid var(--line);display:flex;padding:8px 12px 20px;z-index:20}
.tabbar button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);font-size:10px;font-weight:600;cursor:pointer}
.tabbar button.on{color:var(--pp)}.tabbar button svg{font-size:22px}
.top{display:flex;align-items:center;gap:12px;padding:10px 0 14px}
.back{width:36px;height:36px;border-radius:50%;background:var(--surf);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);flex-shrink:0}
.h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
.h2{font-size:18px;font-weight:700;margin:16px 0 10px}
.sub{color:var(--ink3);font-size:13px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(0,0,0,.05)}
.av{width:38px;height:38px;border-radius:50%;background:var(--pp);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.btn{background:var(--pp);color:#fff;border:none;border-radius:13px;padding:15px;text-align:center;font-weight:700;font-size:15px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:var(--surf);color:var(--pp);border:1.5px solid var(--ppln)}
.lab{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.mut{color:var(--ink3);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--ppbg);color:var(--pp);font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:20px;padding:7px 13px;font-weight:600;font-size:13px;cursor:pointer;user-select:none}.chip.on{background:var(--ppbg);color:var(--pp);border-color:var(--ppln)}
.tile{display:flex;align-items:center;gap:14px;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:11px;cursor:pointer;width:100%;text-align:left}
.tile .ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;flex-shrink:0;background:var(--pp)}
.go{margin-left:auto;color:var(--ink3)}
.field{margin-bottom:14px}.field label{font-size:12px;font-weight:600;color:var(--ink2);display:block;margin-bottom:6px}
.field input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px;font-family:inherit;font-size:15px;font-weight:500}
.field input:focus{outline:none;border-color:var(--ppln)}
.anon{display:flex;gap:10px;align-items:flex-start;background:var(--ppbg);border-radius:12px;padding:12px;margin-bottom:14px}
.anon .d{font-size:12px;color:var(--pp);line-height:1.5;font-weight:600}
.bar{flex:1;background:var(--bg);border-radius:20px;overflow:hidden;height:16px}
.bar i{display:block;height:100%;border-radius:20px}
.big{font-size:30px;font-weight:800;color:var(--pp)}
</style>
</head>
<body>
<div class="device"><div class="viewport">
  <div class="status"><span>9:41</span><div class="dd"><i></i><i></i><i></i></div></div>
  <div class="screen" id="screen"></div>
  <div class="tabbar" id="tabbar"></div>
</div></div>
<script>
var ICON={
 school:'<svg class="i" viewBox="0 0 24 24"><path d="M3 21h18M5 21V8l7-4 7 4v13M9 21v-4h6v4M9 12h.01M15 12h.01"/></svg>',
 users:'<svg class="i" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
 coin:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.5A2.5 2.5 0 0 0 12 8.5h-1.5a2 2 0 0 0 0 4H13a2 2 0 0 1 0 4h-1.5A2.5 2.5 0 0 1 9 15M12 7v1.5M12 15.5V17"/></svg>',
 user:'<svg class="i" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>',
 defi:'<svg class="i" viewBox="0 0 24 24"><path d="M21 3v5l-11 9-4 4-3-3 4-4 9-11z"/><path d="M5 13l6 6"/><path d="M14.3 17.3l3.7 3.7 3-3-3.7-3.7"/><path d="M10 5.5 8 3H3v5l3 2.5"/></svg>',
 qr:'<svg class="i" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z"/></svg>',
 plus:'<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
 chev:'<svg class="i" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>',
 back:'<svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
 lock:'<svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
 image:'<svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
 list:'<svg class="i" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
 wand:'<svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.4 4.1L17.5 8l-4.1 1.4L12 13.5l-1.4-4.1L6.5 8l4.1-.9zM19 14l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>',
 check:'<svg class="i" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
 book:'<svg class="i" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z"/></svg>',
 settings:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
 refresh:'<svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg>'
};
function qrSvg(){var r='';for(var y=0;y<11;y++)for(var x=0;x<11;x++){if((x*y+x+y)%3===0||(x<3&&y<3)||(x>7&&y<3)||(x<3&&y>7))r+='<rect x="'+(x*10)+'" y="'+(y*10)+'" width="10" height="10" fill="#111"/>';}return '<svg viewBox="0 0 110 110" style="width:120px;height:120px">'+r+'</svg>';}

var scr=document.getElementById('screen'), tb=document.getElementById('tabbar');
var TABS=[['classes','Classes','school'],['cagnotte','Cagnotte','coin'],['profil','Profil','user']];
var current='welcome';
function nav(s){current=s;render();scr.scrollTop=0;}

var CLASSES=[['Terminale Bac Pro',19,1240],['1re Bac Pro Commerce',22,860],['2de Bac Pro ASSP',18,540]];
var ELEVES=[['Soso',512,'#534AB7'],['Lilou',395,'#1E6FCC'],['MarcX',300,'#C27C0A'],['Nadir06',280,'#0E9E6E'],['Emma_V',255,'#D63050'],['Karim.T',210,'#7F77DD']];

var SCREENS={
 welcome:function(){return '<div style="text-align:center;padding-top:56px">'+
   '<div style="width:66px;height:66px;border-radius:18px;background:var(--pp);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 18px">'+ICON.school+'</div>'+
   '<div class="h1" style="text-align:center">Espace professeur</div>'+
   '<div class="sub" style="text-align:center;margin-top:8px">Lycée de Vence<br>Histoire · Géo · EMC · PSE</div>'+
   '<div style="margin-top:34px"><button class="btn" onclick="nav(\'classes\')">Accéder à mes classes</button></div>'+
   '<div class="anon" style="margin-top:22px;text-align:left">'+ICON.lock+'<div class="d">Tu ne vois que les pseudos de tes élèves. Aucune coordonnée, aucun message : anonymat total.</div></div>'+
   '</div>';
 },
 classes:function(){return '<div class="top" style="justify-content:space-between"><div class="h1">Mes classes</div><div class="av" style="background:var(--gold)">R</div></div>'+
   '<div class="card" style="display:flex;align-items:center;gap:12px;background:var(--ppbg);border:0"><div style="width:40px;height:40px;border-radius:11px;background:var(--pp);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px">'+ICON.coin+'</div><div style="flex:1"><div class="lab" style="color:var(--pp)">Cagnotte de l\'année</div><div style="font-weight:700;font-size:15px">1 500 pts à distribuer</div></div></div>'+
   CLASSES.map(function(c,i){return '<button class="tile" onclick="nav(\'classe\')"><div class="ic">'+ICON.users+'</div><div style="flex:1"><div style="font-weight:700;font-size:15px">'+c[0]+'</div><div class="mut">'+c[1]+' élèves · '+c[2]+' pts générés</div></div><div class="go">'+ICON.chev+'</div></button>';}).join('')+
   '<button class="btn sec" style="margin-top:4px" onclick="nav(\'classe\')">'+ICON.plus+' Créer une classe</button>';
 },
 classe:function(){return '<div class="top"><button class="back" onclick="nav(\'classes\')">'+ICON.back+'</button><div><div class="sub">Terminale · Lycée de Vence</div><div class="h1" style="font-size:21px">Terminale Bac Pro</div></div></div>'+
   '<div class="card" style="display:flex;justify-content:space-between;align-items:center"><div><div class="lab">Points générés par la classe</div><div class="big">1 240</div></div><div style="text-align:right"><div class="lab">Élèves</div><div style="font-size:22px;font-weight:800">19</div></div></div>'+
   '<button class="btn" style="margin:2px 0 4px" onclick="nav(\'quizbuild\')">'+ICON.plus+' Créer un quiz pour la classe</button>'+
   '<div class="anon">'+ICON.lock+'<div class="d">Tu ne vois que les pseudos — aucune coordonnée d\'élève.</div></div>'+
   '<div class="h2" style="margin-top:6px">Élèves &amp; points individuels</div>'+
   ELEVES.map(function(e){return '<div class="row" style="cursor:pointer" onclick="nav(\'eleve\')"><div class="av" style="background:'+e[2]+'">'+e[0][0].toUpperCase()+'</div><div style="flex:1"><div style="font-weight:700;font-size:15px">'+e[0]+'</div><div class="mut">pseudo choisi par l\'élève</div></div><div style="font-weight:800;color:var(--pp);margin-right:8px">'+e[1]+'</div><span class="go">'+ICON.chev+'</span></div>';}).join('')+
   '<button class="btn" style="margin-top:14px" onclick="nav(\'addeleve\')">'+ICON.plus+' Ajouter un élève (pseudo)</button>';
 },
 addeleve:function(){return '<div class="top"><button class="back" onclick="nav(\'classe\')">'+ICON.back+'</button><div class="h1">Ajouter un élève</div></div>'+
   '<div class="anon">'+ICON.lock+'<div class="d">Le pseudo est choisi par l\'élève. Tu n\'enregistres aucune coordonnée, aucun nom réel.</div></div>'+
   '<div class="field"><label>Pseudo de l\'élève</label><input placeholder="ex. Soso, NadirX, Emma_V"></div>'+
   '<div class="field"><label>Ou numéro (optionnel)</label><input placeholder="ex. 4B · Carlos"></div>'+
   '<button class="btn" onclick="nav(\'classe\')">Ajouter à la classe</button>'+
   '<button class="btn sec" style="margin-top:10px" onclick="nav(\'classe\')">Annuler</button>';
 },
 eleve:function(){return '<div class="top"><button class="back" onclick="nav(\'classe\')">'+ICON.back+'</button><div><div class="sub">Terminale Bac Pro</div><div class="h1" style="font-size:22px">Soso</div></div></div>'+
   '<div class="card" style="text-align:center"><div class="lab">Points de cet élève</div><div class="big" style="font-size:38px">512</div><div class="mut">2e de la classe</div></div>'+
   '<div class="anon">'+ICON.lock+'<div class="d">Aucune identité, aucune coordonnée — seulement ce pseudo.</div></div>'+
   '<div class="h2">Points par matière</div>'+
   [['Histoire',82,'#D63050'],['Géo',64,'#1E6FCC'],['EMC',74,'#C27C0A'],['PSE',58,'#0E9E6E']].map(function(m){return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><div style="width:64px;font-size:12px;font-weight:600">'+m[0]+'</div><div class="bar"><i style="width:'+m[1]+'%;background:'+m[2]+'"></i></div><div style="width:34px;text-align:right;font-weight:700;font-size:12px;color:var(--pp)">'+m[1]+'%</div></div>';}).join('')+
   '<button class="btn" style="margin-top:14px" onclick="nav(\'qrpoints\')">'+ICON.qr+' Remettre des points (QR)</button>';
 },
 qrpoints:function(){return '<div class="top"><button class="back" onclick="nav(\'eleve\')">'+ICON.back+'</button><div class="h1">Remise de points</div></div>'+
   '<div class="card" style="text-align:center;padding:20px"><div class="lab">À remettre au pseudo Soso</div><div class="big" style="margin:6px 0 14px">+50 pts</div><div style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:inline-block">'+qrSvg()+'</div><div class="mut" style="margin-top:10px">L\'élève scanne ce QR pour créditer ses points.</div></div>'+
   '<div class="anon">'+ICON.lock+'<div class="d">Le QR porte un jeton à usage unique, pas une identité. Tu déclenches, l\'élève réclame.</div></div>'+
   '<button class="btn" onclick="nav(\'eleve\')">Terminé</button>';
 },
 quizbuild:function(){return '<div class="top"><button class="back" onclick="nav(\'classe\')">'+ICON.back+'</button><div class="h1">Nouveau quiz</div></div>'+
   '<div class="card"><div class="lab" style="margin-bottom:10px">R\u00e9glages</div>'+
     '<div class="field" style="margin-bottom:12px"><label>Titre</label><input value="Le jeu des puissances"></div>'+
     '<div class="lab" style="font-size:10px;margin-bottom:6px">Niveau / classe</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"><div class="chip on" onclick="chipPick(this)">Terminale Bac Pro</div><div class="chip" onclick="chipPick(this)">1re Commerce</div><div class="chip" onclick="chipPick(this)">2de ASSP</div></div>'+
     '<div class="lab" style="font-size:10px;margin-bottom:6px">Mati\u00e8re</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"><div class="chip on" onclick="chipPick(this)">Histoire</div><div class="chip" onclick="chipPick(this)">G\u00e9o</div><div class="chip" onclick="chipPick(this)">EMC</div><div class="chip" onclick="chipPick(this)">PSE</div></div>'+
     '<div class="lab" style="font-size:10px;margin-bottom:6px">Difficult\u00e9</div><div style="display:flex;gap:6px;margin-bottom:12px"><div class="chip" onclick="chipPick(this)">Facile</div><div class="chip on" onclick="chipPick(this)">Moyen</div><div class="chip" onclick="chipPick(this)">Difficile</div></div>'+
     '<div class="lab" style="font-size:10px;margin-bottom:6px">Th\u00e8me (selon le programme)</div><div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px">'+['Le jeu des puissances','La guerre froide','La d\u00e9colonisation','Mondialisation','La Ve R\u00e9publique'].map(function(t,i){return '<div class="chip'+(i===0?' on':'')+'" style="white-space:nowrap;flex-shrink:0" onclick="chipPick(this)">'+t+'</div>';}).join('')+'</div>'+
     '<div class="lab" style="font-size:10px;margin-bottom:6px">D\u00e9lai par question</div><div style="display:flex;gap:6px"><div class="chip" onclick="chipPick(this)">10 s</div><div class="chip on" onclick="chipPick(this)">20 s</div><div class="chip" onclick="chipPick(this)">30 s</div><div class="chip" onclick="chipPick(this)">45 s</div></div>'+
   '</div>'+
   '<div class="h2">Questions ('+QUESTIONS.length+')</div>'+
   QUESTIONS.map(function(qq,i){var cols=['#D63050','#0E9E6E','#1E6FCC','#C27C0A'];return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="lab">Question '+(i+1)+'</div>'+(qq.valid?'<span class="pill" style="background:var(--grbg);color:var(--gr)">Valid\u00e9e</span>':'<span class="pill" style="background:#FBEEDA;color:var(--am)">\u00c0 valider</span>')+'</div><div style="font-weight:600;font-size:15px;margin-bottom:10px">'+qq.q+'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px">'+qq.a.map(function(ans,j){return '<div style="background:'+cols[j%4]+';color:#fff;border-radius:8px;padding:9px;font-size:12.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center">'+ans+(qq.c===j?' '+ICON.check:'')+'</div>';}).join('')+'</div><div style="display:flex;gap:7px"><button class="chip'+(qq.valid?' on':'')+'" style="flex:1;justify-content:center" onclick="qValid('+i+')">'+(qq.valid?'Valid\u00e9e':'Valider')+'</button><button class="chip" style="flex:1;justify-content:center" onclick="qEdit('+i+')">Modifier</button><button class="chip" style="justify-content:center;color:var(--re);border-color:#F0C0C0" onclick="qDel('+i+')">Supprimer</button></div></div>';}).join('')+
   '<button class="btn sec" style="margin-bottom:14px" onclick="qAdd()">'+ICON.plus+' Ajouter une question</button>'+
   '<div class="lab" style="margin-bottom:8px">Ou g\u00e9n\u00e9rer plusieurs questions</div>'+
   '<button class="tile" style="padding:13px;margin-bottom:9px" onclick="nav(\'quizbanque\')"><div class="ic" style="width:42px;height:42px;font-size:19px;background:var(--am)">'+ICON.list+'</div><div><div style="font-weight:700;font-size:14px">Banque de questions</div><div class="mut">pioche par th\u00e8me et difficult\u00e9</div></div></button>'+
   '<button class="tile" style="padding:13px" onclick="nav(\'quizia\')"><div class="ic" style="width:42px;height:42px;font-size:19px;background:var(--gr)">'+ICON.wand+'</div><div><div style="font-weight:700;font-size:14px">Assist\u00e9 par IA</div><div class="mut">g\u00e9n\u00e8re selon le niveau voulu</div></div></button>'+
   '<button class="btn" style="margin-top:14px" onclick="nav(\'quizlaunch\')">Publier &amp; lancer</button>'+
   '<button class="btn sec" style="margin-top:10px" onclick="nav(\'classe\')">Enregistrer le brouillon</button>';
 },
  quizia:function(){return '<div class="top"><button class="back" onclick="nav(\'quizbuild\')">'+ICON.back+'</button><div class="h1">G\u00e9n\u00e9rer par IA</div></div>'+
   '<div class="field"><label>Th\u00e8me ou cours</label><input value="La guerre froide (1947-1991)"></div>'+
