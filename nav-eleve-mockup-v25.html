<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flowin Révision — maquette navigation élève</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --pp: #534AB7; --ppbg: #EEEDFE; --ppln: #CECBF6;
    --ink: #14162A; --ink2: #3D3F5C; --ink3: #6B7094;
    --line: #E4E3F0; --bg: #F5F3FF; --gold: #E0A800; --am: #C27C0A; --ambg:#FBEEDA;
    --gr: #0E9E6E; --grbg:#E3F7EF; --re: #D63050; --bl:#1E6FCC; --surf:#FDFBFF;
  }
  * { box-sizing: border-box; min-width: 0; }
  body { margin: 0; font-family: 'DM Sans', system-ui, sans-serif; background: #FAFAFC; color: var(--ink); padding: 16px 6px; min-height: 100vh; }
  .wrap { max-width: 900px; width: 100%; box-sizing: border-box; margin: 0 auto; }
  .title { font-size: 13px; font-weight: 700; color: var(--ink3); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
  .subtitle { font-size: 20px; font-weight: 800; margin-bottom: 20px; }
  .toggle { display: flex; gap: 8px; margin-bottom: 24px; max-width: 320px; }
  .toggle button { flex: 1; padding: 10px; border-radius: 10px; border: 1.5px solid var(--line); background: white; color: var(--ink3); font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; }
  .toggle button.active { border-color: var(--ppln); background: var(--ppbg); color: var(--pp); }

  #phone-wrap { width: 100%; max-width: 300px; margin: 0 auto; }
  #frame-mobile { width: 100%; aspect-ratio: 300 / 580; border: 7px solid var(--ink); border-radius: 36px; overflow: hidden; background: var(--bg); position: relative; box-shadow: 0 20px 50px -20px rgba(20,20,45,.3); display: flex; flex-direction: column; }
  .notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 120px; height: 26px; background: var(--ink); border-radius: 14px; z-index: 5; }
  .statusbar { padding: 16px 26px 4px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; background: white; flex-shrink: 0; }
  .mtop { background: white; border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .mtop .brand { flex: 1; }
  .brand { display: flex; align-items: center; gap: 7px; }
  .brand-icon { width: 24px; height: 24px; border-radius: 7px; background: linear-gradient(135deg,#5B52C9,#7F77DD); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .brand-name { font-weight: 700; font-size: 13px; }
  #mobile-screen { padding: 18px 14px; flex: 1; overflow-y: auto; }
  #bottom-nav { display: flex; background: white; border-top: 1px solid var(--line); flex-shrink: 0; padding: 6px 2px 10px; }
  .navlist-item { display: flex; align-items: center; gap: 12px; padding: 13px 10px; border-radius: 12px; border: none; background: transparent; width: 100%; text-align: left; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 700; color: var(--ink2); margin-bottom: 2px; }
  .navlist-item.active { background: var(--ppbg); color: var(--pp); }
  .bnav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; border: none; background: transparent; padding: 6px 2px; cursor: pointer; font-family: inherit; }
  .bnav-item span { font-size: 8.5px; font-weight: 700; color: var(--ink3); }
  .bnav-item.active span { color: var(--pp); }
  .desktop-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 9px; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--gold); color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
  .pseudo { font-size: 13px; font-weight: 700; }

  #frame-desktop { display: none; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: 0 20px 50px -20px rgba(20,20,45,.15); }
  .dlayout { display: flex; min-height: 560px; }
  .sidebar { width: 190px; background: white; border-right: 1px solid var(--line); padding: 16px 11px; display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar .brand { padding: 0 7px 20px; }
  #desktop-screen { padding: 24px; background: var(--bg); }

  nav button { display: flex; align-items: center; gap: 10px; padding: 10px 11px; border-radius: 10px; border: none; text-align: left; cursor: pointer; width: 100%; font-size: 13px; font-weight: 700; background: transparent; color: var(--ink2); font-family: inherit; margin-bottom: 1px; }
  nav button.active { background: var(--ppbg); color: var(--pp); }

  .note { margin-top: 24px; font-size: 12.5px; color: var(--ink3); max-width: 700px; line-height: 1.6; }

  /* --- styles réutilisés pour reproduire fidèlement les écrans réels --- */
  .card { background: white; border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .icon-sq { border-radius: 11px; display: flex; align-items: center; justify-content: center; color: white; flex-shrink: 0; }
  .kpi-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .kpi { flex: 1; }
  .kpi .v { font-size: 17px; font-weight: 800; line-height: 1; }
  .kpi .l { font-size: 9px; font-weight: 700; color: var(--ink3); text-transform: uppercase; margin-top: 4px; }
  .h-greet { color: var(--ink3); font-size: 13px; }
  .h-title { font-size: 20px; font-weight: 800; margin: 2px 0 16px; }
  .sec-title { font-size: 14px; font-weight: 800; margin-bottom: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 11px; font-weight: 700; color: var(--ink2); }
  .chip.active { border-color: var(--ppln); background: var(--ppbg); color: var(--pp); }
  .tile { border-radius: 14px; padding: 10px; background: white; border: 1px solid var(--line); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .badge { font-size: 9px; font-weight: 800; padding: 3px 9px; border-radius: 999px; }
  svg.i { display: block; }
  @keyframes popin { from { opacity:0; transform:scale(.9); } to { opacity:1; transform:scale(1); } }
  @keyframes cardspin {
    0% { transform: rotate(0deg) scale(1); opacity:1; }
    60% { transform: rotate(360deg) scale(1.06); opacity:1; }
    100% { transform: rotate(720deg) scale(.5) translateY(-40px); opacity:0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">Flowin Révision</div>
  <div class="subtitle">Maquette navigable — espace élève (vrai contenu)</div>

  <div class="toggle">
    <button id="btn-mobile" class="active" onclick="setMode('mobile')">Mobile</button>
    <button id="btn-desktop" onclick="setMode('desktop')">Desktop</button>
  </div>

  <div id="phone-wrap">
  <div id="frame-mobile">
    <div class="notch"></div>
    <div class="statusbar">
      <span>9:41</span>
      <span style="display:flex; align-items:center; gap:4px;">
        <svg viewBox="0 0 18 12" width="16" height="11"><rect x="0" y="7" width="3" height="5" rx="0.5" fill="var(--ink)"/><rect x="4.5" y="5" width="3" height="7" rx="0.5" fill="var(--ink)"/><rect x="9" y="3" width="3" height="9" rx="0.5" fill="var(--ink)"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="var(--ink)"/></svg>
        <svg viewBox="0 0 24 12" width="21" height="11"><rect x="1" y="1" width="19" height="10" rx="2.5" stroke="var(--ink)" stroke-width="1" fill="none"/><rect x="2.5" y="2.5" width="15" height="7" rx="1.2" fill="var(--ink)"/><rect x="21" y="4" width="1.5" height="4" rx="0.7" fill="var(--ink)"/></svg>
      </span>
    </div>
    <div id="mtop-row" class="mtop">
      <button id="back-btn" onclick="goBack()" aria-label="Retour" style="border:none;background:none;padding:4px;cursor:pointer;display:none;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="brand" id="brand-block">
        <div class="brand-icon"><svg viewBox="0 0 24 24" width="13" height="13" fill="white"><path d="M12 2 15 9l7 .5-5.5 4.5L18 21l-6-3.8L6 21l1.5-7L2 9.5 9 9z"/></svg></div>
        <span class="brand-name">Flowin Révision</span>
      </div>
      <button id="burger-btn" onclick="openMoreMenu()" aria-label="Plus" style="border:none;background:none;padding:4px;cursor:pointer;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
    <div id="mobile-screen"></div>
    <div id="bottom-nav"></div>
  </div>
  </div>

  <div id="frame-desktop">
    <div class="dlayout">
      <div class="sidebar">
        <div class="brand"><div class="brand-icon"><svg viewBox="0 0 24 24" width="13" height="13" fill="white"><path d="M12 2 15 9l7 .5-5.5 4.5L18 21l-6-3.8L6 21l1.5-7L2 9.5 9 9z"/></svg></div><span class="brand-name">Flowin Révision</span></div>
        <nav id="desktop-nav"></nav>
        <div class="desktop-footer"><div class="avatar">T</div><span class="pseudo">TestDefi1</span></div>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; overflow:hidden;">
        <div id="desktop-topbar" style="display:none; align-items:center; gap:8px; padding:16px 24px 0;">
          <button id="back-btn-desktop" onclick="goBack()" aria-label="Retour" style="border:none;background:var(--ppbg);color:var(--pp);padding:6px 10px;border-radius:9px;cursor:pointer;font-family:inherit;font-weight:700;font-size:12px;display:flex;align-items:center;gap:5px;">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            Retour
          </button>
        </div>
        <div id="desktop-screen" style="flex:1; overflow-y:auto;"></div>
      </div>
    </div>
  </div>

  <div class="note">Reproduction fidèle des écrans réellement construits — couleurs, icônes et structure identiques à l'app.</div>
</div>

<script>
function icon(path, extra) {
  return '<svg class="i" viewBox="0 0 24 24" width="'+(extra&&extra.w||18)+'" height="'+(extra&&extra.w||18)+'" fill="none" stroke="'+(extra&&extra.stroke||'currentColor')+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="'+path+'"/></svg>';
}
function qrPattern(seed) {
  var h = 0;
  for (var i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  var cells = [];
  for (var y = 0; y < 11; y++) {
    for (var x = 0; x < 11; x++) {
      var on = ((h >> ((x * y + x + y) % 24)) & 1) === 1 || (x < 3 && y < 3) || (x > 7 && y < 3) || (x < 3 && y > 7);
      if (on) cells.push('<rect x="'+(x*10)+'" y="'+(y*10)+'" width="10" height="10" fill="#14162A"/>');
    }
  }
  return cells.join('');
}
function palierMois(rang, titre, partenaire, couleur) {
  return '<div class="row" style="padding:7px 0;'+(rang<3?'border-bottom:1px solid var(--line);':'')+'">'
    + '<div style="width:24px;height:24px;border-radius:50%;background:'+couleur+';color:white;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;">'+rang+'</div>'
    + '<div style="flex:1;"><div style="font-size:11.5px;font-weight:800;">'+titre+'</div><div style="font-size:10px;color:var(--ink3);">'+partenaire+'</div></div>'
  + '</div>';
}

var ICONS = {
  home:'M3 10l9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
  book:'M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z',
  star:'M12 2 15 9l7 .5-5.5 4.5L18 21l-6-3.8L6 21l1.5-7L2 9.5 9 9z',
  sword:'M21 3v5l-11 9-4 4-3-3 4-4 9-11zM5 13l6 6M14.3 17.3l3.7 3.7 3-3-3.7-3.7M10 5.5 8 3H3v5l3 2.5',
  people:'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
  trophy:'M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 4H4v2a3 3 0 0 0 3 3M17 4h3v2a3 3 0 0 1-3 3',
  user:'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
  coin:'M14.5 9.5A2.5 2.5 0 0 0 12 8.5h-1.5a2 2 0 0 0 0 4H13a2 2 0 0 1 0 4h-1.5A2.5 2.5 0 0 1 9 15M12 8V6m0 14v-2',
  flame:'M12 12c2-2.96 0-7-1-8 0 3.038-1.773 4.741-3 6-1.226 1.26-2 3.24-2 5a6 6 0 1 0 12 0c0-1.532-1.056-3.94-2-5-1.786 3-2.791 3-4 2z',
  chevron:'M9 18l6-6-6-6',
  gift:'M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7',
  wheel_pointer:'M4 21l7-7M14 10l7-7M14 10l-2.5-2.5L18 1l3 3-6.5 6.5L14 10zM10 14l2.5 2.5L6 23l-3-3 6.5-6.5L10 14z',
  check:'M20 6 9 17l-5-5'
};

// ---- QUIZ EN DIRECT (room ouverte par la prof — pendant côté élève de nav-prof-mockup.html) ----
var ROOM_QUIZ = { actif: true, titre: 'Quiz du jour', matiere: 'Histoire', classe: 'Tale Bac Pro Vente' };
var etapeEleveRoom = 'landing'; // landing -> attente -> question -> resultats
var joueursConnectesRoom = ['Mailys','Lilou','TestDefi1'];
var questionActuelleRoom = 0, TOTAL_Q_ROOM = 5, DUREE_Q_ROOM = 15, tempsRestantRoom = DUREE_Q_ROOM, minuteurRoomId = null, animationValidationRoom = false;
var SCORES_ROOM = [{pseudo:'Lilou',pts:85},{pseudo:'Mailys',pts:80},{pseudo:'TestDefi1',pts:62},{pseudo:'Noah',pts:40}];
function eleveValiderEntreeRoom(){
  animationValidationRoom = true;
  selectScreen('quiz-room');
  setTimeout(function(){ animationValidationRoom=false; etapeEleveRoom='attente'; selectScreen('quiz-room'); }, 900);
}
function demarrerMinuteurRoom(){
  arreterMinuteurRoom();
  tempsRestantRoom = DUREE_Q_ROOM;
  minuteurRoomId = setInterval(function(){
    tempsRestantRoom--;
    if (tempsRestantRoom <= 0) arreterMinuteurRoom();
    if (activeSub==='quiz-room') selectScreen('quiz-room');
  }, 1000);
}
function arreterMinuteurRoom(){ if (minuteurRoomId) { clearInterval(minuteurRoomId); minuteurRoomId=null; } }
function eleveRepondreRoom(){ etapeEleveRoom='attente_resultat'; arreterMinuteurRoom(); selectScreen('quiz-room'); }
// Fonction de démo uniquement : simule côté élève que la prof vient de clore la question et publier les résultats
function demoProfClotQuestion(){ etapeEleveRoom='resultats'; selectScreen('quiz-room'); }
// Fonction de démo uniquement : simule côté élève que la prof vient de lancer le quiz (dans le vrai produit, ceci arrive via le realtime)
function demoProfLanceQuiz(){ etapeEleveRoom='question'; questionActuelleRoom=1; demarrerMinuteurRoom(); selectScreen('quiz-room'); }
function screenQuizRoom(){
  if (etapeEleveRoom === 'landing') {
    return '<div class="card" style="text-align:center;padding:20px 14px;'+(animationValidationRoom?'animation:popflip .9s ease;':'')+'">'
      + '<style>@keyframes popflip{0%{transform:scale(1) rotateY(0);}50%{transform:scale(1.08) rotateY(180deg);}100%{transform:scale(1) rotateY(360deg);}}</style>'
      + '<div style="width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--re),#B02540);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;">'+icon(ICONS.sword,{w:22,stroke:'white'})+'</div>'
      + '<div style="font-weight:800;font-size:14px;">'+ROOM_QUIZ.titre+'</div>'
      + '<div style="font-size:10px;color:var(--ink3);margin:2px 0 14px;">'+ROOM_QUIZ.matiere+' · '+ROOM_QUIZ.classe+'</div>'
      + '<div style="display:flex;justify-content:center;gap:16px;margin-bottom:16px;">'
        + '<div><div style="font-weight:800;font-size:13px;">'+TOTAL_Q_ROOM+'</div><div style="font-size:8px;color:var(--ink3);font-weight:700;">QUESTIONS</div></div>'
        + '<div><div style="font-weight:800;font-size:13px;">'+DUREE_Q_ROOM+'s</div><div style="font-size:8px;color:var(--ink3);font-weight:700;">PAR QUESTION</div></div>'
      + '</div>'
      + '<div style="font-size:10px;color:var(--ink3);background:var(--bg);border-radius:9px;padding:9px 10px;margin-bottom:14px;">Ta prof ne voit que ton pseudo — jamais ton identité réelle.</div>'
      + '<button onclick="eleveValiderEntreeRoom()" style="display:block;width:100%;background:var(--pp);color:white;font-weight:800;font-size:12.5px;padding:12px;border-radius:12px;border:none;font-family:inherit;cursor:pointer;">Valider — le chrono démarre</button>'
    + '</div>';
  }
  if (etapeEleveRoom === 'attente') {
    return '<div class="card" style="text-align:center;padding:24px 14px;">'
      + '<div style="width:40px;height:40px;border-radius:50%;border:3px solid var(--ppln);border-top-color:var(--pp);margin:0 auto 12px;animation:spin .9s linear infinite;"></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style>'
      + '<div style="font-weight:800;font-size:12px;">Tu es dans la room</div>'
      + '<div style="font-size:10px;color:var(--ink3);margin-top:4px;">En attente que le prof lance le quiz…</div>'
      + '<div class="sec-title" style="margin-top:16px;text-align:left;">'+joueursConnectesRoom.length+' élève(s) connecté(s)</div>'
      + joueursConnectesRoom.map(function(p){return '<div class="row card" style="margin-bottom:6px;padding:8px 11px;text-align:left;"><div style="width:20px;height:20px;border-radius:50%;background:var(--pp);color:white;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;">'+p[0]+'</div><span style="font-size:11px;font-weight:700;">'+p+'</span></div>';}).join('')
      + '<button onclick="demoProfLanceQuiz()" class="btn" style="margin-top:10px;display:block;width:100%;background:var(--pp);color:white;font-weight:800;font-size:12.5px;padding:12px;border-radius:12px;border:none;font-family:inherit;cursor:pointer;">Simuler : la prof lance le quiz</button>'
    + '</div>';
  }
  if (etapeEleveRoom === 'question') {
    var options = ['Paris','Lyon','Marseille','Lille'];
    var couleurTemps = tempsRestantRoom <= 5 ? 'var(--re)' : 'var(--pp)';
    return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">'
        + '<span style="font-size:10px;color:var(--ink3);">Question '+questionActuelleRoom+' sur '+TOTAL_Q_ROOM+'</span>'
        + '<span style="font-weight:800;font-size:12px;color:'+couleurTemps+';">'+tempsRestantRoom+'s</span>'
      + '</div>'
      + '<div class="card" style="text-align:center;margin-bottom:10px;"><div style="font-weight:800;font-size:12.5px;">Quelle est la capitale ?</div></div>'
      + options.map(function(o){return '<button onclick="eleveRepondreRoom()" class="card" style="width:100%;text-align:left;font-family:inherit;cursor:pointer;margin-bottom:7px;font-weight:700;font-size:11.5px;">'+o+'</button>';}).join('')
      + '<div style="font-size:10px;color:var(--ink3);text-align:center;margin-top:6px;">Toute la classe répond en même temps.</div>';
  }
  if (etapeEleveRoom === 'attente_resultat') {
    return '<div class="card" style="text-align:center;padding:24px 14px;">'
      + '<div style="width:44px;height:44px;border-radius:50%;background:var(--grbg);color:var(--gr);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;">'+icon(ICONS.check,{w:20,stroke:'var(--gr)'})+'</div>'
      + '<div style="font-weight:800;font-size:12.5px;">Réponse envoyée</div>'
      + '<div style="font-size:10px;color:var(--ink3);margin-top:4px;">En attente que ta prof passe à la suite — le score n\'est pas encore visible.</div>'
      + '<button onclick="demoProfClotQuestion()" style="margin-top:14px;display:block;width:100%;background:var(--ppbg);color:var(--pp);font-weight:800;font-size:11px;padding:10px;border-radius:12px;border:none;font-family:inherit;cursor:pointer;">Simuler : la prof clôt et publie</button>'
    + '</div>';
  }
  var moyenne = Math.round(SCORES_ROOM.reduce(function(a,s){return a+s.pts;},0)/SCORES_ROOM.length);
  return '<div class="card" style="text-align:center;padding:20px 14px;margin-bottom:12px;">'
    + '<div style="width:56px;height:56px;border-radius:50%;background:var(--grbg);color:var(--gr);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;">'+icon(ICONS.check,{w:26,stroke:'var(--gr)'})+'</div>'
    + '<div style="font-weight:800;font-size:14px;">Envoyé !</div>'
    + '<div style="font-size:10px;color:var(--ink3);margin-top:4px;">Points en attente du classement final.</div>'
  + '</div>'

var quizMatieres = {Histoire:true, 'Géo':true, EMC:true, PSE:true};
function toggleQuizMatiere(m) {
  var actives = Object.keys(quizMatieres).filter(function(k){return quizMatieres[k];});
  if (quizMatieres[m] && actives.length <= 1) return; // toujours garder au moins une matière
  quizMatieres[m] = !quizMatieres[m];
  selectScreen('quiz');
}
function lancerSpin() {
  var actives = Object.keys(quizMatieres).filter(function(k){return quizMatieres[k];});
  var tirage = actives[Math.floor(Math.random()*actives.length)];
  var prefixe = tirage.slice(0,4); // 'Géo' matche 'Géographie' dans FICHES
  var idFiche = Object.keys(FICHES).filter(function(id){ return FICHES[id].mat.indexOf(prefixe)===0; })[0];
  document.querySelectorAll('[id="spin-resultat"]').forEach(function(el){
    el.innerHTML = 'Thème tiré : <b style="color:var(--pp);">'+tirage+'</b> !'
      + (idFiche ? '<button onclick="selectScreen(\'quiz-fiche-'+idFiche+'\')" style="display:block;margin:12px auto 0;background:var(--pp);color:white;font-weight:800;font-size:11.5px;padding:9px 18px;border-radius:11px;border:none;font-family:inherit;cursor:pointer;">Jouer sur ce thème →</button>' : '<div style="font-size:10.5px;color:var(--ink3);margin-top:8px;">Pas encore de fiche jouable sur ce thème.</div>');
  });
}
function genererGradientRoue(actives, couleurs){
  if (actives.length === 0) return 'var(--line)';
  var segment = 360 / actives.length;
  var parts = actives.map(function(m, i){
    var debut = Math.round(i * segment);
    var fin = Math.round((i + 1) * segment);
    return couleurs[m] + ' ' + debut + 'deg ' + fin + 'deg';
  });
  return 'conic-gradient(' + parts.join(', ') + ')';
}

  var couleurs = {Histoire:'var(--re)','Géo':'var(--bl)',EMC:'var(--am)',PSE:'var(--gr)'};

function melanger(tableau){
  var copie = tableau.slice();
  for (var i = copie.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = copie[i]; copie[i] = copie[j]; copie[j] = tmp;
  }
  return copie;
}

var activeSub = null;      // sous-écran ouvert par-dessus (détail, ou le menu "plus" du burger)

function iconSvg(path, active) {
  return icon(path, {w:16, stroke: active ? '#534AB7' : '#6B7094'});
}
function isMainItem(k) { return items.some(function (i) { return i.k === k; }); }

function findScreen(k) {
  var it = items.filter(function (i) { return i.k === k; })[0];
  if (it) return it;
  if (subScreens[k]) return { k: k, render: subScreens[k] };
  return items[0]; // filet de sécurité : jamais de crash sur une clé inconnue
}

// --- Sidebar desktop (toujours visible, les 7 items - pas de contrainte d'espace) ---
function renderDesktopNav() {
  var el = document.getElementById('desktop-nav');
  el.innerHTML = items.map(function (it) {
    var active = it.k === current;
    return '<button class="' + (active ? 'active' : '') + '" onclick="selectScreen(\'' + it.k + '\')">' + iconSvg(it.icon, active) + '<span>' + it.label + '</span></button>';
  }).join('');
}
function renderDesktopScreen() {
  document.getElementById('desktop-screen').innerHTML = findScreen(activeSub || current).render();
}

// --- Mobile : barre du bas = 4 fonctions coeur, burger en haut = le reste ---
function renderBottomNav() {
  var el = document.getElementById('bottom-nav');
  el.innerHTML = bottomItems.map(function (it) {
    var active = it.k === current && !activeSub;
    return '<button class="bnav-item' + (active ? ' active' : '') + '" onclick="selectScreen(\'' + it.k + '\')">' + iconSvg(it.icon, active) + '<span>' + it.label + '</span></button>';
  }).join('');
}
function renderMobileScreenContent() {
  document.getElementById('mobile-screen').innerHTML = findScreen(activeSub || current).render();
}
function updateMobileChrome() {
  document.getElementById('back-btn').style.display = activeSub ? 'block' : 'none';
  document.getElementById('burger-btn').style.display = activeSub ? 'none' : 'block';
  document.getElementById('desktop-topbar').style.display = activeSub ? 'flex' : 'none';
}
function openMoreMenu() {
  activeSub = 'more-menu';
  renderMobileScreenContent();
  updateMobileChrome();
}
function goBack() {
  if (activeSub) {
    activeSub = null;
    renderMobileScreenContent();
    renderDesktopScreen();
    updateMobileChrome();
  }
}

function selectScreen(k) {
  if (isMainItem(k)) {
    current = k;
    activeSub = null;
  } else {
    activeSub = k; // sous-écran de détail : l'onglet du bas reste sur la page d'où on vient
  }
  renderDesktopNav();
  renderDesktopScreen();
  renderBottomNav();
  renderMobileScreenContent();
  updateMobileChrome();
}

function setMode(m) {
  document.getElementById('frame-mobile').style.display = m === 'mobile' ? 'flex' : 'none';
  document.getElementById('frame-desktop').style.display = m === 'desktop' ? 'block' : 'none';
  document.getElementById('btn-mobile').className = m === 'mobile' ? 'active' : '';
  document.getElementById('btn-desktop').className = m === 'desktop' ? 'active' : '';
}

renderDesktopNav();
renderDesktopScreen();
renderBottomNav();
renderMobileScreenContent();
updateMobileChrome();
setMode('mobile');
</script>
</body>
</html>
